# Footnote canonical settings
#
# Rule of thumb:
# - normal runtime settings live in this file
# - secrets stay in environment variables / Fly secrets
# - for discord-bots credentials, put env var NAMES here, never secret values

version: 1

deployment:
    target: 'fly'
    fly-app: 'footnote'

# Backend HTTP runtime
server:
    host: '::'
    port: 3000
    trust-proxy: false
    data-dir: '/data'

# Browser-facing policy defaults
web:
    allowed-origins:
        - 'http://localhost:8080'
        - 'http://localhost:3000'
    frame-ancestors:
        - "'self'"
        - 'https://www.jordanmakes.dev'
        - 'https://jordanmakes.dev'
        - 'https://jordanmakes.fly.dev'
        - 'http://localhost:8080'
        - 'http://localhost:3000'

# Discord bots supervised by the server process.
# Most users can keep this empty at first.
discord-bots: []

# Backend context integrations. Project-document retrieval is fail-open and
# remains disabled until explicitly enabled.
chat-workflow:
    chat-context-project-docs-enabled: false
    chat-context-project-docs-embedding-provider: 'openai'
    chat-context-project-docs-embedding-model: 'text-embedding-3-small'
    chat-context-project-docs-max-chunk-bytes: 2000
    chat-context-project-docs-max-chunks: 200
    chat-context-project-docs-top-k-per-category: 5
    chat-context-project-docs-max-matches: 6
    chat-context-project-docs-min-score: 0.35
    chat-context-project-docs-timeout-ms: 8000

