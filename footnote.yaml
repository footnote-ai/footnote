# Footnote canonical settings
#
# Rule of thumb:
# - normal runtime settings live in this file
# - secrets stay in environment variables / Fly secrets
# - for discord-bots credentials, put env var NAMES here, never secret values
# - TrustGraph target sets stay in deployment bootstrap environment
#   (EXECUTION_CONTRACT_TRUSTGRAPH_TARGETS), not in this YAML file

version: 1

deployment:
    target: 'fly'
    fly-app: 'footnote'

# Backend HTTP runtime
server:
    host: '::'
    port: 3000
    trust-proxy: false
    data-dir: '/data'

# Browser-facing policy defaults
web:
    allowed-origins:
        - 'http://localhost:8080'
        - 'http://localhost:3000'
    frame-ancestors:
        - "'self'"
        - 'https://www.jordanmakes.dev'
        - 'https://jordanmakes.dev'
        - 'https://jordanmakes.fly.dev'
        - 'http://localhost:8080'
        - 'http://localhost:3000'

# Discord bots supervised by the server process. Keep env key names only,
# never secret values.
discord-bots:
    - id: footnote
      enabled: true
      required: false
      credentials:
          discord-token-env: FOOTNOTE_DISCORD_TOKEN
          discord-client-id-env: FOOTNOTE_DISCORD_CLIENT_ID
          discord-guild-ids-env: FOOTNOTE_DISCORD_GUILD_IDS
          discord-user-id-env: FOOTNOTE_DISCORD_USER_ID
          incident-secret-env: INCIDENT_PSEUDONYMIZATION_SECRET
      profile:
          id: footnote
          display-name: Footnote
          mention-aliases: [footnote, fn]
    - id: danny
      enabled: true
      required: false
      credentials:
          discord-token-env: DANNY_DISCORD_TOKEN
          discord-client-id-env: DANNY_DISCORD_CLIENT_ID
          discord-guild-ids-env: DANNY_DISCORD_GUILD_IDS
          discord-user-id-env: DANNY_DISCORD_USER_ID
          incident-secret-env: INCIDENT_PSEUDONYMIZATION_SECRET
      profile:
          id: danny
          display-name: Danny
          overlay-path: /app/packages/prompts/src/profile-overlays/danny.md
          mention-aliases: [danny]
    - id: myuri
      enabled: true
      required: false
      credentials:
          discord-token-env: MYURI_DISCORD_TOKEN
          discord-client-id-env: MYURI_DISCORD_CLIENT_ID
          discord-guild-ids-env: MYURI_DISCORD_GUILD_IDS
          discord-user-id-env: MYURI_DISCORD_USER_ID
          incident-secret-env: INCIDENT_PSEUDONYMIZATION_SECRET
      profile:
          id: myuri
          display-name: Myuri
          overlay-path: /app/packages/prompts/src/profile-overlays/myuri.md
          mention-aliases: [myuri]
    - id: winter
      enabled: true
      required: false
      credentials:
          discord-token-env: WINTER_DISCORD_TOKEN
          discord-client-id-env: WINTER_DISCORD_CLIENT_ID
          discord-guild-ids-env: WINTER_DISCORD_GUILD_IDS
          discord-user-id-env: WINTER_DISCORD_USER_ID
          incident-secret-env: INCIDENT_PSEUDONYMIZATION_SECRET
      profile:
          id: winter
          display-name: Winter
          overlay-path: /app/packages/prompts/src/profile-overlays/winter.md
          mention-aliases: [winter]

# Model routing
# The canonical Fly deployment uses OpenRouter DeepSeek for normal generation,
# planning, and the provider-neutral assessment loop.
openai:
    default-profile-id: 'openrouter-deepseek-v4-flash-0731'
    planner-profile-id: 'openrouter-deepseek-v4-flash-0731'

# Context integrations run in the backend. Project-document lookup stays off
# until you enable it; chat continues if the lookup fails.
chat-workflow:
    # Canonical Fly opt-in. Fresh installs remain disabled because the runtime
    # default for this optional presentation flow is false.
    # Presentation is disabled to reserve the workflow allowance for the delivered answer.
    chat-presentation-enabled: false
    chat-presentation-profile-id: 'openrouter-deepseek-v4-flash-0731'
    max-tokens-total-override: 512000
    chat-presentation-timeout-ms: 90000
    chat-context-project-docs-enabled: false
    chat-context-project-docs-embedding-provider: 'openai'
    chat-context-project-docs-embedding-model: 'text-embedding-3-small'
    chat-context-project-docs-max-chunk-bytes: 2000
    chat-context-project-docs-max-chunks: 200
    chat-context-project-docs-top-k-per-category: 5
    chat-context-project-docs-max-matches: 6
    chat-context-project-docs-min-score: 0.35
    chat-context-project-docs-timeout-ms: 8000

