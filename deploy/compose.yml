name: footnote-server

services:
    server:
        image: ${FOOTNOTE_IMAGE_REF:-ghcr.io/footnote-ai/footnote:latest}
        env_file:
            - ../.env
        environment:
            PORT: '3000'
        ports:
            - '8080:3000'
        volumes:
            # Breaking change: volume name is `footnote_data` (previously `footnote-data`).
            # Migration instructions are documented in deploy/README.md.
            - footnote_data:/data
            - ../footnote.yaml:/data/config/footnote.yaml:ro
        restart: unless-stopped

volumes:
    footnote_data:
