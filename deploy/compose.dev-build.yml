name: footnote-server-dev-build

services:
    server:
        build:
            context: ..
            dockerfile: deploy/Dockerfile.server
        image: ${FOOTNOTE_IMAGE_REF:-ghcr.io/footnote-ai/footnote:latest}
        env_file:
            - ../.env
        environment:
            PORT: '3000'
        ports:
            - '8080:3000'
        volumes:
            - footnote_data:/data
            - ../footnote.yaml:/data/config/footnote.yaml:ro
        restart: unless-stopped

volumes:
    footnote_data:
