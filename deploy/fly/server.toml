# Fly app: canonical Footnote server (backend + local node supervisor)
app = 'footnote'
primary_region = 'ord'

[build]
  dockerfile = '../Dockerfile.server'

[env]
  NODE_ENV = 'production'
  DEFAULT_PROFILE_ID = 'openrouter-deepseek-v4-flash-0731'
  ALLOWED_ORIGINS = 'https://ai.jordanmakes.dev'
  FRAME_ANCESTORS = 'https://ai.jordanmakes.dev'
  TURNSTILE_ALLOWED_HOSTNAMES = 'ai.jordanmakes.dev'
  OLLAMA_BASE_URL = 'https://ollama.com'
  TAILSCALE_HOSTNAME = 'footnote-fly'
  TAILSCALE_TAGS = 'tag:footnote-fly'

[[services]]
  internal_port = 3000
  protocol = 'tcp'
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = 'connections'

[[mounts]]
  source = 'footnote_data'
  destination = '/data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '768mb'
