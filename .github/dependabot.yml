version: 2
updates:
    # ─── Core Node.js / TypeScript Packages ─────────────────────────────────────
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 10
      groups:
          core-dependencies:
              patterns: ['*']
      ignore:
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']
      labels:
          - 'dependencies'

    # ─── Fly.io Deployment Stack ──────────────────────────────────────────────────
    - package-ecosystem: 'docker'
      directory: '/'
      schedule:
          interval: 'weekly' # Faster cadence = patch vulnerabilities earlier
      ignore:
          - dependency-name: 'node'
            update-types: ['version-update:semver-major']
      labels:
          - 'dependencies'
          - 'area: deployment'

    # ─── GitHub Actions ─────────────────────────────────────────────────────────
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      labels:
          - 'dependencies'
          - 'area: ci'
