version: 2
updates:
    # ─── Core Node.js / TypeScript Packages ─────────────────────────────────────
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 10
      groups:
          ai-runtime:
              patterns:
                  - 'ai'
                  - '@ai-sdk/*'
                  - 'ollama-ai-provider-v2'

          openai-runtime:
              patterns:
                  - 'openai'
                  - '@openai/agents'
          web-runtime:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
                  - 'react-router-dom'
                  - 'vite'
                  - '@vitejs/plugin-react'
                  - 'astro'
          typescript-eslint:
              patterns:
                  - '@typescript-eslint/eslint-plugin'
                  - '@typescript-eslint/parser'
      ignore:
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']
      labels:
          - 'dependencies'

    # ─── Fly.io Deployment Stack ──────────────────────────────────────────────────
    - package-ecosystem: 'docker'
      directory: '/'
      schedule:
          interval: 'weekly' # Faster cadence = patch vulnerabilities earlier
      ignore:
          - dependency-name: 'node'
            update-types: ['version-update:semver-major']
      labels:
          - 'dependencies'
          - 'area: deployment'

    # ─── GitHub Actions ─────────────────────────────────────────────────────────
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      labels:
          - 'dependencies'
          - 'area: ci'
