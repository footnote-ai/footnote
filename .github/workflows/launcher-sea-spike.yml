name: launcher-sea-spike

on:
    workflow_dispatch:
        inputs:
            draft_tag:
                description: 'Optional draft release tag (for example sea-spike-2026-05-20)'
                required: false
                type: string
    pull_request:
        paths:
            - '.github/workflows/launcher-sea-spike.yml'
            - 'tools/sea/**'
            - 'packages/launcher-core/**'
            - 'packages/launcher-cli/**'
            - 'package.json'
            - 'pnpm-lock.yaml'

permissions:
    contents: read

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 22

            - run: corepack enable
            - run: corepack prepare pnpm@11.16.0 --activate
            - run: pnpm install --frozen-lockfile
            - run: pnpm sea:build-launcher
            - run: pnpm sea:package
            - run: pnpm sea:verify
            - run: pnpm sea:checksums

            - name: Upload SEA artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: sea-${{ runner.os }}-${{ runner.arch }}
                  path: artifacts/sea

    publish-draft:
        permissions:
            contents: write
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_tag != '' }}
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  path: artifacts/sea

            - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
              with:
                  tag_name: ${{ inputs.draft_tag }}
                  name: SEA Spike ${{ inputs.draft_tag }}
                  draft: true
                  prerelease: true
                  files: artifacts/sea/**/*
