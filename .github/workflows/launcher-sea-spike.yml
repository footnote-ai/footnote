name: launcher-sea-spike

on:
    workflow_dispatch:
        inputs:
            draft_tag:
                description: 'Optional draft release tag (for example sea-spike-2026-05-20)'
                required: false
                type: string
    pull_request:
        paths:
            - '.github/workflows/launcher-sea-spike.yml'
            - 'tools/sea/**'
            - 'packages/launcher-core/**'
            - 'packages/launcher-cli/**'
            - 'package.json'
            - 'pnpm-lock.yaml'

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: corepack enable
            - run: corepack prepare pnpm@10.27.0 --activate
            - run: pnpm install --frozen-lockfile
            - run: pnpm sea:build-launcher
            - run: pnpm sea:package
            - run: pnpm sea:verify
            - run: pnpm sea:checksums

            - name: Upload SEA artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sea-${{ runner.os }}-${{ runner.arch }}
                  path: artifacts/sea

    publish-draft:
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_tag != '' }}
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts/sea

            - uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.draft_tag }}
                  name: SEA Spike ${{ inputs.draft_tag }}
                  draft: true
                  prerelease: true
                  files: artifacts/sea/**/*
