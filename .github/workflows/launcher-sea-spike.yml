name: launcher-sea-spike

on:
    workflow_dispatch:
        inputs:
            draft_tag:
                description: 'Optional draft release tag (for example sea-spike-2026-05-20)'
                required: false
                type: string
    pull_request:
        paths:
            - '.github/workflows/ci.yml'
            - '.github/workflows/launcher-package.yml'
            - '.github/workflows/launcher-release.yml'
            - '.github/workflows/launcher-sea-spike.yml'
            - 'tools/sea/**'
            - 'packages/contracts/**'
            - 'packages/config-spec/**'
            - 'packages/launcher-core/**'
            - 'packages/launcher-cli/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig.json'

permissions:
    contents: read

jobs:
    build:
        permissions:
            contents: read
        uses: ./.github/workflows/launcher-package.yml

    publish-draft:
        permissions:
            contents: write
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_tag != '' }}
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  path: artifacts/sea

            - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
              with:
                  tag_name: ${{ inputs.draft_tag }}
                  name: SEA Spike ${{ inputs.draft_tag }}
                  draft: true
                  prerelease: true
                  files: artifacts/sea/**/footnote-*
                  fail_on_unmatched_files: true
