name: Publish GHCR Image

on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'
            - '[0-9]*.[0-9]*.[0-9]*'

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - id: context
              name: Prepare revision-safe project context bundle
              shell: bash
              run: |
                  set -euo pipefail
                  node scripts/prepare-project-context-bundle.mjs
                  echo "revision=$(cat .footnote/context-bundle/revision.txt)" >> "$GITHUB_OUTPUT"

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: ghcr.io/footnote-ai/footnote
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=short,prefix=sha-,enable={{is_default_branch}}
                      type=match,pattern=v([0-9]+\.[0-9]+\.[0-9]+),group=0,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
                      type=match,pattern=v?([0-9]+\.[0-9]+\.[0-9]+),group=1,enable=${{ startsWith(github.ref, 'refs/tags/') }}

            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  file: deploy/Dockerfile.server
                  build-args: |
                      FOOTNOTE_CONTEXT_COMMIT_SHA=${{ steps.context.outputs.revision }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
