name: launcher-release

on:
    push:
        tags:
            - 'v*.*.*'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        permissions:
            contents: read
        uses: ./.github/workflows/launcher-package.yml

    publish:
        permissions:
            contents: write
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  path: artifacts/sea

            - run: find artifacts/sea -type f
            - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
              with:
                  files: artifacts/sea/**/footnote-*
                  fail_on_unmatched_files: true
