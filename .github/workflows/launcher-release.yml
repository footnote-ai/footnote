name: launcher-release

on:
    push:
        tags:
            - 'v*.*.*'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 22
            - run: corepack enable
            - run: corepack prepare pnpm@10.27.0 --activate
            - run: pnpm install --frozen-lockfile
            - run: pnpm sea:build-launcher
            - run: pnpm sea:package
            - run: pnpm sea:verify

            - name: Upload platform artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: sea-${{ runner.os }}-${{ runner.arch }}
                  path: artifacts/sea

    publish:
        permissions:
            contents: write
        if: startsWith(github.ref, 'refs/tags/')
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  path: artifacts/sea

            - run: find artifacts/sea -type f
            - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
              with:
                  files: artifacts/sea/**/footnote-*
