name: launcher-release

on:
    push:
        tags:
            - 'v*.*.*'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        permissions:
            contents: read
        uses: ./.github/workflows/launcher-package.yml

    publish:
        permissions:
            contents: write
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  path: artifacts/sea

            - run: find artifacts/sea -type f
            - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
              with:
                  files: artifacts/sea/**/footnote-*
                  fail_on_unmatched_files: true
