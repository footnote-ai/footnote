# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
    push:
        branches:
            - main
jobs:
    deploy-server:
        name: Deploy server
        permissions:
            contents: read
        runs-on: ubuntu-latest
        concurrency: deploy-server
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: superfly/flyctl-actions/setup-flyctl@master
            - id: context
              name: Prepare revision-safe project context bundle
              shell: bash
              run: |
                  set -euo pipefail
                  node scripts/prepare-project-context-bundle.mjs
                  echo "revision=$(cat .footnote/context-bundle/revision.txt)" >> "$GITHUB_OUTPUT"
            - name: Synchronize canonical runtime settings
              shell: bash
              run: |
                  set -euo pipefail
                  settings_hash="$(sha256sum footnote.yaml | awk '{print $1}')"
                  settings_base64="$(base64 < footnote.yaml | tr -d '\n')"
                  remote_script="$(cat <<'NODE_SCRIPT'
                  const fs = require('node:fs');
                  const crypto = require('node:crypto');
                  const targetPath = '/data/config/footnote.yaml';
                  const tempPath = `${targetPath}.tmp-${process.pid}`;
                  const expectedHash = '__EXPECTED_HASH__';
                  const settingsBase64 = '__SETTINGS_BASE64__';

                  try {
                    fs.mkdirSync('/data/config', { recursive: true });
                    fs.writeFileSync(tempPath, Buffer.from(settingsBase64, 'base64'));
                    const actualHash = crypto.createHash('sha256').update(fs.readFileSync(tempPath)).digest('hex');
                    if (actualHash !== expectedHash) {
                      throw new Error('settings hash mismatch');
                    }
                    fs.renameSync(tempPath, targetPath);
                    console.log(`FOOTNOTE_SETTINGS_SHA256=${actualHash}`);
                  } catch (error) {
                    try {
                      fs.unlinkSync(tempPath);
                    } catch {
                      // Best-effort cleanup; the original error is the actionable failure.
                    }
                    const message = error instanceof Error ? error.message : String(error);
                    console.error(`footnote.yaml sync failed: ${message}`);
                    process.exitCode = 1;
                  }
                  NODE_SCRIPT
                  )"
                  remote_script="${remote_script//__EXPECTED_HASH__/$settings_hash}"
                  remote_script="${remote_script//__SETTINGS_BASE64__/$settings_base64}"
                  remote_script_base64="$(printf '%s' "$remote_script" | base64 | tr -d '\n')"
                  remote_command="node -e \"eval(Buffer.from('$remote_script_base64','base64').toString('utf8'))\""
                  set +e
                  output="$(flyctl ssh console -a footnote -C "$remote_command" 2>&1)"
                  fly_status=$?
                  set -e
                  printf '%s\n' "$output"
                  if ! grep -Fq "FOOTNOTE_SETTINGS_SHA256=$settings_hash" <<<"$output"; then
                      echo "Unable to synchronize canonical footnote.yaml (fly exit code $fly_status)." >&2
                      exit 1
                  fi
                  if [[ $fly_status -ne 0 ]]; then
                      echo "Fly CLI returned exit code $fly_status after settings hash verification succeeded." >&2
                      exit 1
                  fi
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
            - run: flyctl deploy --remote-only -c deploy/fly/server.toml --build-arg FOOTNOTE_CONTEXT_COMMIT_SHA=${{ steps.context.outputs.revision }}
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
