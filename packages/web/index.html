<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Footnote — Answers you can check</title>
        <meta
            name="description"
            content="A transparency-first AI framework that pairs responses with inspectable provenance and trace metadata."
        />
        <meta
            name="keywords"
            content="AI framework, transparency, provenance, trace metadata, open source, Discord bot, self-hosted, human oversight"
        />
        <meta name="author" content="Footnote Team" />
        <meta name="copyright" content="Footnote" />
        <!-- Open Graph metadata to enrich social sharing previews across platforms -->
        <meta property="og:title" content="Footnote — Answers you can check" />
        <meta
            property="og:description"
            content="A transparency-first AI framework that pairs responses with inspectable provenance and trace metadata."
        />
        <meta property="og:image" content="/social-card.png" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://ai.jordanmakes.dev" />
        <meta property="og:site_name" content="Footnote" />
        <meta property="og:locale" content="en_US" />
        <!-- Twitter / X card metadata ensures large-format previews when links are shared -->
        <meta name="twitter:card" content="summary_large_image" />
        <!-- Performance and accessibility -->
        <meta name="theme-color" content="#5865F2" />
        <meta name="color-scheme" content="light dark" />
        <!-- Favicon and app icons -->
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/assets/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/assets/android-chrome-192x192.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="512x512"
            href="/assets/android-chrome-512x512.png"
        />
        <!-- Structured data for search engines -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "SoftwareApplication",
                "name": "Footnote",
                "description": "A transparency-first AI framework that pairs responses with inspectable provenance and trace metadata.",
                "applicationCategory": "CommunicationApplication",
                "operatingSystem": "Self-hosted",
                "offers": {
                    "@type": "Offer",
                    "price": "0",
                    "priceCurrency": "USD"
                },
                "creator": {
                    "@type": "Organization",
                    "name": "Footnote Team"
                }
            }
        </script>
        <script>
            try {
                if (
                    window.localStorage.getItem('footnote-theme-preference') ===
                    'dark'
                ) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch {
                // The app safely falls back to the light theme when storage is unavailable.
            }
        </script>
        <style>
            :root {
                color-scheme: light;
                background: #fdfcf9;
            }

            :root[data-theme='dark'] {
                color-scheme: dark;
                background: #1c1b1a;
            }

            body {
                margin: 0;
                background: inherit;
                color: #2b2a27;
            }

            :root[data-theme='dark'] body {
                color: #e3e0d7;
            }

            #root {
                min-height: 100dvh;
            }

            .preload-shell {
                box-sizing: border-box;
                min-height: 100dvh;
                margin: 0;
                display: grid;
                place-content: center;
                background: inherit;
                color: inherit;
            }

            .preload-shell__state {
                width: 1.25rem;
                height: 1.25rem;
                color: #2b2a27;
            }

            :root[data-theme='dark'] .preload-shell__state {
                color: #e3e0d7;
            }

            .preload-shell__state .spinner {
                width: 100%;
                height: 100%;
                display: block;
            }

            .preload-shell__state .spinner::before {
                content: '';
                display: block;
                width: 100%;
                height: 100%;
                border-radius: 50%;
                border: 0.125em solid currentColor;
                border-right-color: transparent;
                box-sizing: border-box;
                animation: spin 0.75s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .preload-shell__state .spinner::before {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="root">
            <div
                class="preload-shell"
                aria-label="Page loading state"
                role="status"
                aria-live="polite"
            >
                <span class="preload-shell__state" aria-hidden="true"
                    ><span class="spinner"></span
                ></span>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
