        # Chat payloads.
        ChatRequest:
            type: object
            properties:
                surface:
                    type: string
                    enum: [web, discord]
                botPersonaId:
                    type: string
                    pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
                    description: Optional bot persona selector used for backend-owned persona overlays (discord).
                personaExpressionStrength:
                    type: string
                    enum: [subtle, balanced, strong]
                    description: Optional backend-resolved persona expression preference. It affects prose only; TRACE posture and safety authority remain backend-owned.
                modeId:
                    type: string
                    enum: [express, balanced, grounded]
                    description: Optional user-facing workflow mode selector (`express`, `balanced`, or `grounded`).
                maxReviewCycles:
                    type: integer
                    minimum: 0
                    description: Optional hard override for reviewed workflow cycle depth.
                traceTarget:
                    type: object
                    description: Optional partial TRACE target override for this request.
                    properties:
                        tightness:
                            type: integer
                            enum: [1, 2, 3, 4, 5]
                        rationale:
                            type: integer
                            enum: [1, 2, 3, 4, 5]
                        attribution:
                            type: integer
                            enum: [1, 2, 3, 4, 5]
                        caution:
                            type: integer
                            enum: [1, 2, 3, 4, 5]
                        extent:
                            type: integer
                            enum: [1, 2, 3, 4, 5]
                    additionalProperties: false
                trigger:
                    type: object
                    properties:
                        kind:
                            type: string
                            enum:
                                [
                                    submit,
                                    direct,
                                    invoked,
                                    alias_candidate,
                                    catchup,
                                ]
                        messageId:
                            type: string
                            minLength: 1
                        addressing:
                            type: object
                            description: Provider-neutral addressing facts used by the planner to resolve ambiguous routing evidence.
                            properties:
                                assistantMentioned:
                                    type: boolean
                                replyToAssistant:
                                    type: boolean
                                otherParticipantMentioned:
                                    type: boolean
                                replyToOtherParticipant:
                                    type: boolean
                            required:
                                - assistantMentioned
                                - replyToAssistant
                                - otherParticipantMentioned
                                - replyToOtherParticipant
                            additionalProperties: false
                    required:
                        - kind
                    additionalProperties: false
                latestUserInput:
                    type: string
                    minLength: 0
                    maxLength: 3072
                    description: May be an empty string for passive catchup requests; chatPlanner will typically default these to ignore.
                conversation:
                    type: array
                    minItems: 1
                    maxItems: 64
                    items:
                        $ref: '#/components/schemas/ChatConversationMessage'
                attachments:
                    type: array
                    maxItems: 8
                    items:
                        $ref: '#/components/schemas/ChatAttachment'
                capabilities:
                    $ref: '#/components/schemas/ChatCapabilities'
                sessionId:
                    type: string
                    minLength: 1
                    maxLength: 128
                surfaceContext:
                    type: object
                    properties:
                        channelId:
                            type: string
                            minLength: 1
                        guildId:
                            type: string
                            minLength: 1
                        userId:
                            type: string
                            minLength: 1
                        requestHost:
                            type: string
                            minLength: 1
                    additionalProperties: false
            required:
                - surface
                - trigger
                - latestUserInput
                - conversation
            additionalProperties: false

