# ====================
# Components
# ====================
components:
    # Auth schemes and signature checks for trusted callers.
    securitySchemes:
        # Shared secret for trace ingestion.
        TraceToken:
            type: apiKey
            in: header
            name: x-trace-token
            description: Shared secret for trusted trace ingestion.
        TrustedServiceToken:
            type: apiKey
            in: header
            name: x-service-token
            description: Shared secret for trusted internal service callers.
        AdminSettingsToken:
            type: apiKey
            in: header
            name: x-admin-token
            description: Dedicated trusted admin token for settings endpoints.
        SetupSessionCookie:
            type: apiKey
            in: cookie
            name: footnote_setup_session
            description: Short-lived setup session cookie accepted while the session remains valid.
        AccountSessionCookie:
            type: apiKey
            in: cookie
            name: footnote_account_session
            description: Opaque local account session cookie. It contains no identity claims or provider tokens.

    # Data models for request/response payloads.
    schemas:
        # Errors.
        # Standard error envelope.
        ErrorResponse:
            type: object
            properties:
                error:
                    type: string
                details:
                    type: string
                retryAfter:
                    type: integer
                    description: Seconds until retry is allowed.
            required:
                - error
            additionalProperties: false

        IncidentStatus:
            type: string
            enum: [new, under_review, confirmed, dismissed, resolved]

        IncidentRemediationState:
            type: string
            enum:
                [
                    pending,
                    applied,
                    already_marked,
                    skipped_not_assistant,
                    failed,
                ]

        IncidentPointers:
            type: object
            properties:
                responseId:
                    type: string
                guildId:
                    type: string
                channelId:
                    type: string
                messageId:
                    type: string
                modelVersion:
                    type: string
                chainHash:
                    type: string
            additionalProperties: false

        IncidentAuditEvent:
            type: object
            properties:
                action:
                    type: string
                    enum:
                        - incident.created
                        - incident.remediated
                        - incident.status_changed
                        - incident.note_added
                actorHash:
                    type: string
                    nullable: true
                notes:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
            required:
                - action
                - createdAt
            additionalProperties: false

        IncidentRemediation:
            type: object
            properties:
                state:
                    $ref: '#/components/schemas/IncidentRemediationState'
                applied:
                    type: boolean
                notes:
                    type: string
                    nullable: true
                updatedAt:
                    type: string
                    format: date-time
                    nullable: true
            required:
                - state
                - applied
            additionalProperties: false

        IncidentSummary:
