                Returns enabled chat profile ids for model/profile switching UX.
                This endpoint is public-safe and excludes provider secrets/internal config.
            tags:
                - Chat
            responses:
                '200':
                    description: Enabled chat profile options.
                    content:
                        application/json:
                            schema:
