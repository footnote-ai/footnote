                      - principal
                      - expiresAt
                      - csrfToken
                  additionalProperties: false

        SetupSessionRequest:
            type: object
            properties:
                code:
                    type: string
                    minLength: 1
            required:
                - code
            additionalProperties: false

        SetupSessionResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                expiresAt:
                    type: string
                    format: date-time
                csrfToken:
                    type: string
            required:
                - ok
                - expiresAt
                - csrfToken
            additionalProperties: false

        SetupOperatorLinkRequest:
            type: object
            properties:
                action:
                    type: string
                    enum:
                        - settings
                        - reset
            required:
                - action
            additionalProperties: false

        SetupOperatorLinkResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                action:
                    type: string
                    enum:
                        - settings
                        - reset
                mode:
                    type: string
                    enum:
                        - operator
                        - first-run
                setupPath:
                    type: string
                setupUrl:
                    type: string
                    format: uri
                expiresAt:
                    type: string
                    format: date-time
                settingsState:
                    type: string
                    enum:
                        - present
                        - missing
                        - reset
                backupPath:
                    type: string
            required:
                - ok
                - action
                - mode
                - setupPath
                - setupUrl
                - expiresAt
                - settingsState
            additionalProperties: false

        AdminSettingsSchemaField:
            type: object
            properties:
                envKey:
                    type: string
                section:
                    type: string
                path:
                    type: array
                    items:
                        type: string
                kind:
                    type: string
                    enum: [string, boolean, integer, number, csv, enum, json]
                description:
                    type: string
                defaultValue:
                    oneOf:
                        - type: string
                        - type: number
                        - type: boolean
                        - type: array
                          items:
                              type: string
                allowedValues:
                    type: array
                    items:
                        type: string
            required:
                - envKey
                - section
                - path
                - kind
                - description
            additionalProperties: false

        AdminSettingsSchemaResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                schemaVersion:
                    type: integer
                settingsDocumentVersion:
                    type: integer
                fields:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminSettingsSchemaField'
            required:
                - ok
                - schemaVersion
                - settingsDocumentVersion
                - fields
            additionalProperties: false

        AdminSettingsValidateResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                valid:
                    type: boolean
                    const: true
                normalizedSummary:
                    type: object
                    properties:
                        version:
                            type: integer
                        settingsKeysCount:
                            type: integer
                        discordBotsCount:
                            type: integer
                    required:
                        - version
                        - settingsKeysCount
                        - discordBotsCount
                    additionalProperties: false
                warnings:
                    type: array
                    items:
                        type: string
                restartRequired:
                    type: boolean
                    const: true
            required:
                - ok
                - valid
                - normalizedSummary
                - warnings
                - restartRequired
            additionalProperties: false

        AdminSettingsValidationError:
            type: object
            properties:
                message:
                    type: string
                pointer:
                    type: string
                    nullable: true
                category:
                    type: string
                    enum:
                        [
                            yaml_parse_error,
                            invalid_root,
                            legacy_shape_removed,
                            invalid_key_format,
                            unsupported_key,
                            secret_key_forbidden,
                            bootstrap_key_forbidden,
                            invalid_version,
                            type_mismatch,
                            payload_too_large,
                            internal_error,
                        ]
            required:
                - message
                - pointer
                - category
            additionalProperties: false

        AdminSettingsValidationFailureResponse:
            type: object
            properties:
                error:
                    type: string
                validationErrors:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminSettingsValidationError'
            required:
                - error
                - validationErrors
            additionalProperties: false

        AdminSettingsYamlPutResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                etag:
                    type: string
                restartRequired:
                    type: boolean
                    const: true
                applied:
                    type: boolean
                    const: false
            required:
                - ok
                - etag
                - restartRequired
                - applied
            additionalProperties: false

    parameters:
        # Shared request parameters.
        # X-Session-Id is sanitized to alphanumeric/dash/underscore and max 128 chars (see chat handler).
        SessionIdHeader:
            name: X-Session-Id
            in: header
            required: false
            description: Optional client-generated session id used for per-session rate limiting; when omitted, the server falls back to IP.
            schema:
                type: string

        TurnstileTokenHeader:
            name: X-Turnstile-Token
            in: header
            required: false
            description: Turnstile CAPTCHA token header when enabled.
            schema:
                type: string

        IfMatchHeader:
            name: If-Match
            in: header
            required: true
            description: Required optimistic concurrency token from latest GET /api/admin/settings.yaml ETag, or `"footnote-settings-missing"` only while settings file is absent.
            schema:
                type: string

        SetupCsrfHeader:
            name: x-setup-csrf
            in: header
            required: false
            description: Required for non-GET admin settings calls when authenticated with setup session cookie.
            schema:
                type: string

        AuthCsrfHeader:
            name: x-auth-csrf
            in: header
            required: false
            description: Required when a valid account session posts local logout.
            schema:
                type: string
                minLength: 1

        TraceResponseId:
            name: responseId
            in: path
            required: true
            description: Response id used to fetch a trace.
            schema:
                type: string

        IncidentId:
            name: incidentId
            in: path
            required: true
            description: Operator-safe incident short ID.
            schema:
                type: string
                minLength: 1

    # No shared request bodies yet.
    requestBodies: {}

