# Spec version for this file; change only when upgrading tooling.
openapi: 3.1.0

# Quick Map
# - POST /api/chat: Chat (public; Turnstile + rate limits when configured)
# - OPTIONS /api/chat: CORS preflight
# - GET /api/chat/profiles: Enabled chat profile options (public)
# - POST /api/internal/text: Trusted internal text task execution
# - POST /api/internal/image: Trusted internal image task execution
# - POST /api/internal/voice/tts: Trusted internal voice TTS execution
# - GET /api/internal/voice/realtime: Trusted internal voice realtime session (WebSocket)
# - POST /api/incidents/report: Incident report create (trusted internal auth)
# - GET /api/incidents: Incident list (trusted internal auth)
# - GET /api/incidents/{incidentId}: Incident detail (trusted internal auth)
# - POST /api/incidents/{incidentId}/status: Incident status update (trusted internal auth)
# - POST /api/incidents/{incidentId}/notes: Incident note append (trusted internal auth)
# - POST /api/incidents/{incidentId}/remediation: Incident remediation update (trusted internal auth)
# - POST /api/traces: Trace upsert (TraceToken required)
# - POST /api/trace-cards: Generate/store trace-card and return PNG payload (TraceToken required)
# - POST /api/trace-cards/from-trace: Generate/store trace-card from stored trace metadata by responseId (TraceToken required)
# - GET /api/traces/{responseId}: Trace fetch (public)
# - GET /api/traces/{responseId}/assets/trace-card.svg: Trace-card SVG fetch (public)
# - POST /api/setup/session: Exchange one-time setup bootstrap code for short-lived setup session
# - DELETE /api/setup/session: Clear setup session cookie
# - POST /api/setup/operator-link: Local-only operator setup/settings link issuance
# - GET /api/auth/login: Start optional OIDC account sign-in
# - GET /api/auth/callback: Validate OIDC callback and create local account session
# - GET /api/auth/session: Read account sign-in availability and local session
# - POST /api/auth/logout: End local Footnote account session
# - GET /api/admin/settings/schema: Admin editable settings schema metadata (AdminSettingsToken OR valid setup session)
# - GET /api/admin/settings/template: Canonical commented settings template YAML (AdminSettingsToken OR valid setup session)
# - GET /api/admin/settings.yaml: Admin canonical settings YAML read (AdminSettingsToken OR valid setup session)
# - POST /api/admin/settings/validate: Admin settings YAML validation (AdminSettingsToken OR valid setup session)
# - PUT /api/admin/settings.yaml: Admin settings YAML replace with If-Match concurrency (AdminSettingsToken OR valid setup session)
# - GET /config.json: Runtime config (public)
# - Operation/code index: docs/api/operation-map.md

# ====================
# Public API metadata
# ====================
info:
    title: Footnote Backend API
    # Versioning: bump when request/response shapes, status codes, or auth requirements change; docs-only edits can skip.
    version: 1.1.0
    license:
        name: MIT + Hippocratic License v3 (HL3-CORE)
        url: docs/LICENSE_STRATEGY.md
    description: |
        Backend wire contract and integration boundary for other packages.
        Chat is the shared backend action-routing boundary for web and Discord surfaces.
        Non-2xx responses use ErrorResponse unless an operation states otherwise.
        info.version is manually maintained (see docs/api/README.md).

# Explicitly mark endpoints as unauthenticated by default.
security: []

# ====================
# Base URLs
# ====================
servers:
    - url: https://{backendHost}
      description: Backend API base URL
      variables:
          backendHost:
              default: api.your-domain.tld

# ====================
# Tags
# ====================
tags:
    - name: Chat
      description: Chat responses.
    - name: Incidents
      description: Internal incident report and review workflows.
    - name: Image # [Reserved]
      description: Image generation.
    - name: Voice # [Reserved]
      description: Voice and audio.
    - name: Traces
      description: Trace storage and retrieval.
    - name: Admin
      description: Trusted admin settings read/validate/write endpoints.
    - name: Accounts
      description: Optional OpenID Connect account sign-in and local sessions.
    - name: System
      description: Runtime config and service metadata.

# ====================
# Endpoints
# ====================
paths:
    # Chat (public, Turnstile when enabled, rate-limited).
    /api/chat:
        post:
            operationId: postChat
            x-codeRefs:
                - packages/backend/src/handlers/chat.ts#createChatHandler
                - packages/web/src/utils/api.ts#chatQuestion
                - packages/contracts/src/web/types.ts#PostChatRequest
                - packages/contracts/src/web/types.ts#PostChatResponse
                - packages/contracts/src/web/schemas.ts#ResponseMetadataSchema
                - packages/contracts/src/policy/types.ts#PersonaExpressionStrength
                - packages/contracts/src/policy/schemas.ts#PersonaExpressionStrengthSchema
            summary: Generate a chat response
            description: |
                Submit a transport-neutral chat request and receive the backend-selected action.
                Public web callers use Turnstile when enabled; trusted internal callers may authenticate with service headers.
                Send X-Session-Id / X-Turnstile-Token headers when needed for browser traffic.
                Optionally provide `botPersonaId` to select the backend-owned bot persona overlay (discord).
                Optionally provide `personaExpressionStrength` to request prose-only persona expression (`subtle`, `balanced`, or `strong`).
                Optionally provide `maxReviewCycles` and `traceTarget` to tune workflow depth and TRACE posture for this request.
            tags:
                - Chat
            parameters:
                - $ref: '#/components/parameters/SessionIdHeader'
                - $ref: '#/components/parameters/TurnstileTokenHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChatRequest'
            responses:
                '200':
                    $ref: '#/components/responses/ChatOk'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
                '502':
                    $ref: '#/components/responses/BadGateway'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
        options:
            operationId: optionsChat
            x-codeRefs:
                - packages/backend/src/handlers/chat.ts#createChatHandler
            summary: CORS preflight
            description: |
                Handle CORS preflight for the chat endpoint.
                Public endpoint; no auth or rate limits.
            tags:
                - Chat
            responses:
                '204':
                    $ref: '#/components/responses/PreflightAccepted'

