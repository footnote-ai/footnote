paths:
    /api/internal/image:
        post:
            operationId: postInternalImageTask
            x-codeRefs:
                - packages/backend/src/handlers/internalImage.ts#handleInternalImageRequest
                - packages/backend/src/services/internalImage.ts#createInternalImageTaskService
                - packages/api-client/src/internalImage.ts#runImageTaskViaApi
                - packages/api-client/src/internalImage.ts#runImageTaskStreamViaApi
                - packages/contracts/src/web/types.ts#PostInternalImageGenerateRequest
                - packages/contracts/src/web/types.ts#PostInternalImageGenerateResponse
            summary: Run a trusted internal image task
            description: >
                Trusted internal endpoint for backend-owned image tasks that should not become a generic image proxy.

                The current task set includes `generate` only.

                Backend now owns image prompt assembly, including the active bot-profile overlay for the image system
                prompt.

                When `stream` is true, the route responds with NDJSON preview events followed by one terminal result
                event.

                Requires either `x-service-token` or `x-trace-token`.

                Applies the backend trusted-service rate limit bucket, including per-token constraints for authenticated
                internal callers.
            tags:
                - Image
            security:
                - TrustedServiceToken: []
                - TraceToken: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InternalImageRequest'
            responses:
                '200':
                    $ref: '#/components/responses/InternalImageTaskOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '502':
                    $ref: '#/components/responses/BadGateway'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /api/internal/voice/tts:
        post:
            operationId: postInternalVoiceTts
            x-codeRefs:
                - packages/backend/src/handlers/internalVoiceTts.ts#handleInternalVoiceTtsRequest
                - packages/backend/src/services/internalVoiceTts.ts#createInternalVoiceTtsService
                - packages/api-client/src/internalVoice.ts#runVoiceTtsViaApi
                - packages/contracts/src/voice/types.ts#PostInternalVoiceTtsRequest
                - packages/contracts/src/voice/types.ts#PostInternalVoiceTtsResponse
                - packages/contracts/src/voice/types.ts#SpeechSelectionMetadata
            summary: Run a trusted internal voice TTS task
            description: >
                Trusted internal endpoint for backend-owned voice synthesis that should not become a generic TTS proxy.

                The current task set includes `synthesize` only.

                Requires either `x-service-token` or `x-trace-token`.

                Applies the backend trusted-service rate limit bucket, including per-token constraints for authenticated
                internal callers.
            tags:
                - Voice
            security:
                - TrustedServiceToken: []
                - TraceToken: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InternalVoiceTtsRequest'
            responses:
                '200':
                    $ref: '#/components/responses/InternalVoiceTtsOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '502':
                    $ref: '#/components/responses/BadGateway'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /api/internal/voice/realtime:
        get:
            operationId: openInternalVoiceRealtime
            x-codeRefs:
                - packages/backend/src/handlers/internalVoiceRealtime.ts#handleUpgrade
                - packages/discord-bot/src/utils/realtimeService.ts#connect
                - packages/contracts/src/voice/types.ts#InternalVoiceRealtimeClientEvent
                - packages/contracts/src/voice/types.ts#InternalVoiceRealtimeServerEvent
                - packages/contracts/src/voice/types.ts#SpeechSelectionMetadata
            summary: Open a trusted internal realtime voice session (WebSocket)
            description: |
                Upgrades the request to a WebSocket connection used for realtime
                voice sessions. Clients send `InternalVoiceRealtimeClientEvent`
                payloads and receive `InternalVoiceRealtimeServerEvent` payloads.
                Requires either `x-service-token` or `x-trace-token`.
            tags:
                - Voice
            security:
                - TrustedServiceToken: []
                - TraceToken: []
            responses:
                '101':
                    description: Switching Protocols (WebSocket accepted).
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
components:
    schemas:
        InternalImageRequest:
            oneOf:
                - $ref: '#/components/schemas/InternalImageGenerateTaskRequest'
            discriminator:
                propertyName: task
                mapping:
                    generate: '#/components/schemas/InternalImageGenerateTaskRequest'
        InternalImageResponse:
            oneOf:
                - $ref: '#/components/schemas/InternalImageGenerateTaskResponse'
            discriminator:
                propertyName: task
                mapping:
                    generate: '#/components/schemas/InternalImageGenerateTaskResponse'
        InternalVoiceTtsRequest:
            type: object
            properties:
                task:
                    type: string
                    enum:
                        - synthesize
                text:
                    type: string
                    minLength: 1
                    maxLength: 8000
                options:
                    $ref: '#/components/schemas/InternalTtsOptions'
                outputFormat:
                    $ref: '#/components/schemas/InternalVoiceOutputFormat'
                channelContext:
                    $ref: '#/components/schemas/InternalVoiceChannelContext'
            required:
                - task
                - text
                - outputFormat
            additionalProperties: false
        InternalVoiceTtsResponse:
            type: object
            properties:
                task:
                    type: string
                    enum:
                        - synthesize
                result:
                    type: object
                    properties:
                        audioBase64:
                            type: string
                            minLength: 1
                        outputFormat:
                            $ref: '#/components/schemas/InternalVoiceOutputFormat'
                        mimeType:
                            type: string
                            minLength: 1
                        model:
                            $ref: '#/components/schemas/InternalTtsModel'
                        voice:
                            $ref: '#/components/schemas/InternalTtsVoice'
                        speechSelection:
                            $ref: '#/components/schemas/SpeechSelectionMetadata'
                        usage:
                            $ref: '#/components/schemas/InternalTtsUsage'
                        costs:
                            $ref: '#/components/schemas/InternalTtsCosts'
                        generationTimeMs:
                            type: integer
                            minimum: 0
                    required:
                        - audioBase64
                        - outputFormat
                        - mimeType
                        - model
                        - voice
                        - speechSelection
                        - usage
                        - costs
                        - generationTimeMs
                    additionalProperties: false
            required:
                - task
                - result
            additionalProperties: false
        InternalVoiceOutputFormat:
            type: string
            enum:
                - mp3
                - opus
                - aac
                - flac
                - wav
                - pcm
        InternalTtsModel:
            type: string
            minLength: 1
            maxLength: 128
        InternalTtsVoice:
            type: string
            minLength: 1
            maxLength: 128
        InternalVoiceChannelContext:
            type: object
            properties:
                channelId:
                    type: string
                    minLength: 1
                guildId:
                    type: string
                    minLength: 1
            additionalProperties: false
        InternalTtsOptions:
            type: object
            properties:
                model:
                    $ref: '#/components/schemas/InternalTtsModel'
                voice:
                    $ref: '#/components/schemas/InternalTtsVoice'
                delivery:
                    type: string
                    minLength: 1
                    maxLength: 500
                speed:
                    type: string
                    enum:
                        - slow
                        - normal
                        - fast
                pitch:
                    type: string
                    enum:
                        - low
                        - normal
                        - high
                emphasis:
                    type: string
                    enum:
                        - none
                        - moderate
                        - strong
                style:
                    type: string
                    minLength: 1
                    maxLength: 200
                styleDegree:
                    type: string
                    enum:
                        - low
                        - normal
                        - high
                styleNote:
                    type: string
                    minLength: 1
                    maxLength: 500
            additionalProperties: false
        InternalTtsUsage:
            type: object
            properties:
                billingUnit:
                    type: string
                    enum:
                        - characters
                        - estimated_tokens
                        - unknown
                inputQuantity:
                    type: integer
                    minimum: 0
                inputCharacters:
                    type: integer
                    minimum: 0
                inputTokens:
                    type: integer
                    minimum: 0
            required:
                - billingUnit
                - inputQuantity
                - inputCharacters
            additionalProperties: false
        InternalTtsCosts:
            type: object
            properties:
                input:
                    type: number
                    minimum: 0
                output:
                    type: number
                    minimum: 0
                total:
                    type: number
                    minimum: 0
                completeness:
                    type: string
                    enum:
                        - complete
                        - partial
                        - unknown
                incompleteReasons:
                    type: array
                    items:
                        type: string
                        enum:
                            - unpriced_model
                            - provider_usage_unavailable
                            - estimated_tts_token_quantity
                            - estimated_tts_character_quantity
            required:
                - input
                - output
                - total
                - completeness
                - incompleteReasons
            additionalProperties: false
        SpeechSelectionMetadata:
            type: object
            properties:
                profileId:
                    type: string
                    minLength: 1
                    maxLength: 32
                modality:
                    type: string
                    enum:
                        - tts
                        - realtime
                provider:
                    type: string
                    minLength: 1
                    maxLength: 64
                model:
                    type: string
                    minLength: 1
                    maxLength: 128
                voice:
                    type: string
                    minLength: 1
                    maxLength: 128
                delivery:
                    type: string
                    maxLength: 500
                    nullable: true
                requestedVoice:
                    type: string
                    maxLength: 128
                    nullable: true
                selectionSource:
                    type: object
                    properties:
                        model:
                            $ref: '#/components/schemas/SpeechSelectionSource'
                        voice:
                            $ref: '#/components/schemas/SpeechSelectionSource'
                        delivery:
                            $ref: '#/components/schemas/SpeechSelectionSource'
                    required:
                        - model
                        - voice
                        - delivery
                    additionalProperties: false
                fallbackReason:
                    type: string
                    maxLength: 300
                    nullable: true
            required:
                - profileId
                - modality
                - provider
                - model
                - voice
                - delivery
                - requestedVoice
                - selectionSource
                - fallbackReason
            additionalProperties: false
        SpeechSelectionSource:
            type: string
            enum:
                - request_or_session
                - operator_profile
                - persona_default
                - deployment_fallback
        InternalImageStreamEvent:
            oneOf:
                - $ref: '#/components/schemas/InternalImagePartialImageEvent'
                - $ref: '#/components/schemas/InternalImageResultEvent'
                - $ref: '#/components/schemas/InternalImageErrorEvent'
            discriminator:
                propertyName: type
                mapping:
                    partial_image: '#/components/schemas/InternalImagePartialImageEvent'
                    result: '#/components/schemas/InternalImageResultEvent'
                    error: '#/components/schemas/InternalImageErrorEvent'
        InternalImageAnnotations:
            type: object
            properties:
                title:
                    type:
                        - string
                        - 'null'
                description:
                    type:
                        - string
                        - 'null'
                note:
                    type:
                        - string
                        - 'null'
                adjustedPrompt:
                    type:
                        - string
                        - 'null'
            required:
                - title
                - description
                - note
            additionalProperties: false
        InternalImageUserContext:
            type: object
            properties:
                username:
                    type: string
                nickname:
                    type: string
                guildName:
                    type: string
            required:
                - username
                - nickname
                - guildName
            additionalProperties: false
        InternalImageChannelContext:
            type: object
            properties:
                channelId:
                    type: string
                guildId:
                    type: string
            additionalProperties: false
        InternalImageUsage:
            type: object
            properties:
                inputTokens:
                    type: integer
                    minimum: 0
                cachedInputTokens:
                    type: integer
                    minimum: 0
                cacheWriteTokens:
                    type: integer
                    minimum: 0
                outputTokens:
                    type: integer
                    minimum: 0
                totalTokens:
                    type: integer
                    minimum: 0
                imageCount:
                    type: integer
                    minimum: 0
                partialImageCount:
                    type: integer
                    minimum: 0
                providerUsageAvailable:
                    type: boolean
            required:
                - inputTokens
                - outputTokens
                - totalTokens
                - imageCount
                - partialImageCount
            additionalProperties: false
        InternalImageCosts:
            type: object
            properties:
                text:
                    type: number
                image:
                    type: number
                total:
                    type: number
                perImage:
                    type: number
            required:
                - text
                - image
                - total
                - perImage
