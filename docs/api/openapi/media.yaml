                            type: string
                            minLength: 1
                        guildId:
                            type: string
                            minLength: 1
                        userId:
                            type: string
                            minLength: 1
                            description: >-
                                Backend-only identity material used to derive a privacy-preserving safety identifier. It
                                is never included in model prompts or logs.
                    additionalProperties: false
            required:
                - task
            additionalProperties: false
            example:
                task: news
                query: latest ai policy
                category: tech
                maxResults: 3
                reasoningEffort: medium
                verbosity: medium
                channelContext:
                    channelId: '123456789012345678'
                    guildId: '234567890123456789'
                    userId: '345678901234567890'
        InternalNewsTaskResponse:
            type: object
            properties:
                task:
                    type: string
                    enum:
                        - news
                result:
                    type: object
                    properties:
                        news:
                            type: array
                            items:
                                $ref: '#/components/schemas/InternalNewsItem'
                        summary:
                            type: string
                    required:
                        - news
                        - summary
                    additionalProperties: false
            required:
                - task
                - result
            additionalProperties: false
            example:
                task: news
                result:
                    news:
                        - title: Policy update
                          summary: A concise summary of the policy change.
                          url: 'https://example.com/news'
                          source: Example News
                          timestamp: '2026-03-18T12:00:00.000Z'
                    summary: One important headline today.
        InternalImageDescriptionTaskRequest:
            type: object
            properties:
                task:
                    type: string
                    enum:
                        - image_description
                imageUrl:
                    type: string
                    format: uri
                context:
                    type: string
                    minLength: 1
                    maxLength: 4096
                channelContext:
                    type: object
                    properties:
                        channelId:
                            type: string
                            minLength: 1
                        guildId:
                            type: string
                            minLength: 1
                    additionalProperties: false
            required:
                - task
                - imageUrl
            additionalProperties: false
            example:
                task: image_description
                imageUrl: 'https://example.com/screenshot.png'
                context: User asked what changed in this screenshot.
                channelContext:
                    channelId: '123456789012345678'
                    guildId: '234567890123456789'
        InternalImageDescriptionTaskResponse:
            type: object
            properties:
                task:
                    type: string
                    enum:
                        - image_description
                result:
                    type: object
                    properties:
                        description:
                            type: string
                        model:
                            type: string
                        usage:
                            type: object
                            properties:
                                inputTokens:
                                    type: integer
                                    minimum: 0
                                outputTokens:
                                    type: integer
                                    minimum: 0
                                totalTokens:
                                    type: integer
                                    minimum: 0
                            required:
                                - inputTokens
                                - outputTokens
                                - totalTokens
