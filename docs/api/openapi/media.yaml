                    type: string
                summary:
                    type: string
                url:
                    type: string
                    format: uri
                source:
                    type: string
                timestamp:
                    type: string
                    format: date-time
                thumbnail:
                    type:
                        - string
                        - 'null'
                    format: uri
                image:
                    type:
                        - string
                        - 'null'
                    format: uri
            required:
                - title
                - summary
                - url
                - source
            additionalProperties: false
        InternalNewsTaskRequest:
            type: object
            properties:
                task:
                    type: string
                    enum:
                        - news
                query:
                    type: string
                    minLength: 1
                    maxLength: 512
                category:
                    type: string
                    minLength: 1
                    maxLength: 128
                maxResults:
                    type: integer
                    minimum: 1
                    maximum: 5
                reasoningEffort:
                    type: string
                    enum:
                        - none
                        - low
                        - medium
                        - high
                        - xhigh
                        - max
                    description: >-
                        Requested reasoning effort. The backend resolves it against the selected model profile and omits
                        unsupported provider settings fail-open.
                verbosity:
                    type: string
                    enum:
                        - low
                        - medium
                        - high
                channelContext:
                    type: object
                    properties:
