                                type: string
                            effectiveProfileId:
                                type: string
                            profileId:
                                type: string
                            provider:
                                type: string
                            model:
                                type: string
                            usage:
                                type: object
                                properties:
                                    promptTokens:
                                        type: integer
                                        minimum: 0
                                    cachedInputTokens:
                                        type: integer
                                        minimum: 0
                                    cacheWriteTokens:
                                        type: integer
                                        minimum: 0
                                    completionTokens:
                                        type: integer
                                        minimum: 0
                                    totalTokens:
                                        type: integer
                                        minimum: 0
                                    reasoningTokens:
                                        type: integer
                                        minimum: 0
                                additionalProperties: false
                            routingChainAttempts:
                                type: array
                                items:
                                    type: object
                                    properties:
                                        index:
                                            type: integer
                                            minimum: 0
                                        profileId:
                                            type: string
                                        provider:
                                            type: string
                                        model:
                                            type: string
                                        status:
                                            type: string
                                        reasonCode:
                                            type: string
                                        finishReason:
                                            type: string
                                            maxLength: 100
                                        completion:
                                            type: object
                                            properties:
                                                status:
                                                    type: string
                                                    enum:
                                                        - completed
                                                        - incomplete
                                                        - failed
                                                        - unknown
                                                reason:
                                                    type: string
                                                    maxLength: 100
                                                visibleTextLength:
                                                    type: integer
                                                    minimum: 0
                                            required:
                                                - status
                                                - visibleTextLength
                                            additionalProperties: false
                                        usage:
                                            type: object
                                            properties:
                                                promptTokens:
                                                    type: integer
                                                    minimum: 0
                                                cachedInputTokens:
                                                    type: integer
                                                    minimum: 0
                                                cacheWriteTokens:
                                                    type: integer
                                                    minimum: 0
                                                completionTokens:
                                                    type: integer
                                                    minimum: 0
                                                totalTokens:
                                                    type: integer
                                                    minimum: 0
                                                reasoningTokens:
                                                    type: integer
                                                    minimum: 0
                                            additionalProperties: false
                                        chooseOneUsed:
                                            type: boolean
                                        chooseOneSelectedIndex:
                                            type: integer
                                            minimum: 0
                                        seedKeyType:
                                            type: string
                                    required:
                                        - index
                                        - profileId
                                        - status
                                        - chooseOneUsed
                                    additionalProperties: false
                            toolName:
                                type: string
                            evaluator:
                                type: object
                                description: Evaluator outcome payload for kind=evaluator execution events.
                                properties:
                                    authorityLevel:
                                        type: string
                                        enum:
                                            - observe
                                            - influence
                                            - enforce
                                    mode:
                                        type: string
                                        enum:
                                            - observe_only
                                            - enforced
                                    provenance:
                                        type: string
                                        enum:
                                            - Retrieved
                                            - Inferred
                                            - Speculative
