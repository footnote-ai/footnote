                                        type: string
                                        enum:
                                            - external_scope_validation_failed
                                            - adapter_scope_mismatch
                                            - adapter_disabled
                                            - adapter_timeout
                                            - adapter_timeout_cancellation_requested
                                            - adapter_error
                                            - adapter_processing_failed
                                            - poisoned_evidence_dropped
                                            - aggregate_signals_neutralized_after_filtering
                                            - ownership_validation_explicitly_none_denied
                                            - ownership_validation_explicitly_none_allowed_non_production
                            required:
                                - externalEvidenceBundleId
                                - externalTraceRefs
                                - adapterVersion
                                - consumedGovernedFieldPaths
                                - consumedByConsumers
                                - droppedEvidenceIds
                                - reasonCodes
                            additionalProperties: false
                    required:
                        - adapterStatus
                        - scopeValidation
                        - terminalAuthority
                        - failOpenBehavior
                        - verificationRequired
                        - advisoryEvidenceItemCount
                        - droppedEvidenceCount
                        - droppedEvidenceIds
                        - provenanceReasonCodes
                        - sufficiencyView
                        - evidenceView
                    additionalProperties: false
                githubContext:
                    $ref: '#/components/schemas/GitHubContextMetadata'
                githubSource:
                    $ref: '#/components/schemas/RepositorySourceMetadata'
                projectContext:
                    $ref: '#/components/schemas/ProjectContextMetadata'
                providerRetention:
                    type: array
                    description: >-
                        Configured/request-side provider posture only. This does not verify provider retention or describe Footnote-owned storage.
                    items:
                        type: object
                        required:
                            - provider
                            - model
                            - requestStorage
                            - providerDataCollection
                            - zeroDataRetention
                            - inferenceLocation
                        properties:
                            provider:
                                type: string
                            model:
                                type: string
                            requestStorage:
                                type: string
                                enum:
                                    [
                                        disabled,
                                        provider_state,
                                        unknown,
                                        unsupported,
                                    ]
                            providerDataCollection:
                                type: string
                                enum: [allow, deny, unknown, unsupported]
                            zeroDataRetention:
                                type: string
                                enum:
                                    [
                                        requested,
                                        not_requested,
                                        unknown,
                                        unsupported,
                                    ]
                            inferenceLocation:
                                type: string
                                enum: [local, remote, unknown]
            required:
                - provenance
                - safetyTier
                - tradeoffCount
                - chainHash
                - licenseContext
                - modelVersion
                - staleAfter
                - citations
                - trace_target
                - trace_final
            additionalProperties: true
        ResponseMetadata:
            allOf:
                - $ref: '#/components/schemas/ResponseMetadataBase'
                - type: object
                  properties:
                      responseId:
                          type: string
                  required:
                      - responseId
    securitySchemes:
        TraceToken:
            type: apiKey
            in: header
            name: x-trace-token
            description: Shared secret for trusted trace ingestion.
        TrustedServiceToken:
            type: apiKey
            in: header
            name: x-service-token
            description: Shared secret for trusted internal service callers.
        AgentToken:
            type: apiKey
            in: header
            name: x-agent-token
            description: Dedicated trusted credential for agent chat callers.
        AdminSettingsToken:
            type: apiKey
            in: header
            name: x-admin-token
            description: Dedicated trusted admin token for settings endpoints.
        SetupSessionCookie:
            type: apiKey
            in: cookie
            name: footnote_setup_session
            description: Short-lived setup session cookie accepted while the session remains valid.
        AccountSessionCookie:
            type: apiKey
            in: cookie
            name: footnote_account_session
            description: Opaque local account session cookie. It contains no identity claims or provider tokens.
        DiscordConnectionCookie:
            type: apiKey
            in: cookie
            name: footnote_discord_connection
            description: 'Opaque, short-lived browser binding for one Discord connection transaction.'
    parameters:
        SessionIdHeader:
            name: X-Session-Id
            in: header
            required: false
            description: >-
                Optional client-generated session id used for per-session rate limiting; when omitted, the server falls
                back to IP.
            schema:
                type: string
        TurnstileTokenHeader:
            name: X-Turnstile-Token
            in: header
            required: false
            description: Turnstile CAPTCHA token header when enabled.
            schema:
                type: string
        IfMatchHeader:
            name: If-Match
            in: header
            required: true
            description: >-
                Required optimistic concurrency token from latest GET /api/admin/settings.yaml ETag, or
                `"footnote-settings-missing"` only while settings file is absent.
            schema:
                type: string
        SetupCsrfHeader:
            name: x-setup-csrf
            in: header
            required: false
            description: Required for non-GET admin settings calls when authenticated with setup session cookie.
            schema:
                type: string
        AuthCsrfHeader:
            name: x-auth-csrf
            in: header
            required: false
            description: Required when a valid account session posts local logout.
            schema:
                type: string
                minLength: 1
        TraceResponseId:
            name: responseId
            in: path
            required: true
            description: Response id used to fetch a trace.
            schema:
                type: string
        IncidentId:
            name: incidentId
            in: path
            required: true
            description: Operator-safe incident short ID.
            schema:
                type: string
                minLength: 1
