                                      - finalizer_provider_error
                              personaId:
                                  type: string
                              draftProfileId:
                                  type: string
                              draftRequestedProvider:
                                  type: string
                              draftRequestedModel:
                                  type: string
                              draftObservedProvider:
                                  type: string
