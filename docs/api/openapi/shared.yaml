                              upstreamRoutingAttemptCount:
                                  type: integer
                                  minimum: 1
                              backendEstimatedCostUsd:
                                  type: number
                                  minimum: 0
                              upstreamReportedCostUsd:
                                  type: number
                                  minimum: 0
                              durationMs:
                                  type: integer
                                  minimum: 0
                              auditOutcome:
                                  type: string
                                  enum:
