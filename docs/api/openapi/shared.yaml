                                    - applied
                                    - adjusted_by_policy
                                    - not_applied
                                description: >-
                                    Required for planner events. Indicates whether planner output became execution input
                                    as-is, was adjusted by workflow policy, or was not applied.
                            mattered:
                                type: boolean
                                description: >-
                                    Required for planner events. Observable planner influence signal, not a claim of
                                    policy authority.
                            matteredControlIds:
                                type: array
                                description: >-
                                    Required for planner events. Control IDs that explain where planner influence
