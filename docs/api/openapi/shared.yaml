paths: {}
components:
    schemas:
        ErrorResponse:
            type: object
            properties:
                error:
                    type: string
                details:
                    type: string
                retryAfter:
                    type: integer
                    description: Seconds until retry is allowed.
            required:
                - error
            additionalProperties: false
        AccountMemoriesResponse:
            type: object
            properties:
                memories:
                    type: array
                    items:
                        $ref: '#/components/schemas/AccountMemory'
            required:
                - memories
            additionalProperties: false
        PresentationGenerationSettings:
            description: Serializable provider-neutral settings used only by the backend presentation evaluation/profile seam.
            x-codeRefs:
                - packages/contracts/src/model-profiles.ts#PresentationGenerationSettings
                - packages/contracts/src/model-profiles.ts#PresentationGenerationSettingsSchema
                - packages/backend/src/services/runtimeRequestControls.ts#resolvePresentationGenerationSettings
            type: object
            properties:
                promptVariant:
                    type: string
                    enum:
                        - current
                        - compact
                maxOutputTokens:
                    type: integer
                    minimum: 1
                reasoningEffort:
                    type: string
                    enum:
                        - none
                        - low
                        - medium
                        - high
                        - xhigh
                        - max
                verbosity:
                    type: string
                    enum:
                        - low
                        - medium
                        - high
                temperature:
                    type: number
                    minimum: 0
                    maximum: 2
                topP:
                    type: number
                    minimum: 0
                    maximum: 1
            additionalProperties: false
        ResponseMetadataBase:
            type: object
            properties:
                provenance:
                    type: string
                    description: 'Expected values are Retrieved, Inferred, or Speculative.'
                safetyTier:
                    type: string
                    description: 'Expected values are Low, Medium, or High.'
                tradeoffCount:
                    type: number
                    description: Expected minimum is 0.
                chainHash:
                    type: string
                licenseContext:
                    type: string
                modelVersion:
                    type: string
                    deprecated: true
                    description: 'Deprecated compatibility mirror of the final generation model. Prefer execution[].'
                staleAfter:
                    type: string
                    format: date-time
                citations:
                    type: array
                    items:
                        $ref: '#/components/schemas/Citation'
                execution:
                    type: array
                    items:
                        type: object
                        required:
                            - kind
                            - status
                        properties:
                            kind:
                                type: string
                                enum:
                                    - planner
                                    - evaluator
                                    - tool
                                    - generation
                            status:
                                type: string
                                enum:
                                    - executed
                                    - skipped
                                    - failed
                            purpose:
                                type: string
                                enum:
                                    - chat_orchestrator_action_selection
                                description: >-
                                    Required for planner events. Canonical bounded planner invocation purpose; not
                                    policy ownership.
                            contractType:
                                type: string
                                enum:
                                    - structured
                                    - text_json
                                    - fallback
                                description: >-
                                    Required for planner events. Planner decision contract execution style used by
                                    backend-owned orchestration.
                            structuredOutputOutcome:
                                type: string
                                enum:
                                    - strict_success
                                    - unsupported_route
                                    - refusal
                                    - incomplete
                                    - no_output
                                    - schema_rejected
                                    - parse_failure
                                    - policy_invalid
                                    - runtime_failure
                                    - text_json_compatibility
                                    - safe_default_fallback
                                description: >-
                                    Sanitized planner transport outcome. This is diagnostic metadata, not policy
                                    authority.
                            upstreamAttribution:
                                type: object
                                properties:
                                    resolvedModel:
                                        type: string
                                    inferenceProvider:
                                        type: string
                                    routingAttempt:
                                        type: integer
                                        minimum: 1
                                    routingAttemptCount:
                                        type: integer
                                        minimum: 1
                                    upstreamReportedCostUsd:
                                        type: number
                                        minimum: 0
                                additionalProperties: false
                            applyOutcome:
                                type: string
