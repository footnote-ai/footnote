                            durationMs:
                                type: integer
                                minimum: 0
                        additionalProperties: false
                workflow:
                    $ref: '#/components/schemas/WorkflowRecord'
                presentation:
                    description: >-
                        Optional backend-owned presentation receipt. In the current flow, an optional presentation model
                        drafts wording and style, Footnote checks that the draft is usable prose, normal answer
                        generation uses it only as a style suggestion while working from authoritative context, and
                        normal assessment/revision reviews the answer. No separate presentation-validator model call
                        runs. Old traces remain readable through the legacy branch, but new runs do not create
                        validator/audit records. Trace upserts that omit flow but contain old finalizer/audit or
                        caution-derived fields are read as legacy data without inventing observed model data.
                    oneOf:
                        - type: object
                          description: >-
                              Current flow. A presentation model may suggest wording and style. Footnote checks only
                              that its draft is usable prose; normal answer generation and assessment/revision make
                              and review the answer from authoritative context.
                          properties:
                              step:
                                  type: string
                                  enum:
                                      - presentation
                              flow:
                                  type: string
                                  enum:
                                      - candidate_review
                              outcome:
                                  type: string
                                  enum:
                                      - candidate_generated
                                      - candidate_unavailable
                              attempted:
                                  type: boolean
                              reasonCode:
                                  type: string
                                  enum:
                                      - candidate_generated
                                      - budget_skipped
                                      - disabled
                                      - profile_not_configured
                                      - candidate_not_admissible
                                      - draft_timeout
                                      - draft_provider_error
                              personaId:
                                  type: string
                              presentationSettings:
                                  description: >-
                                      Backend-owned presentation setting resolution. Unsupported settings are omitted
                                      fail-open and never become user-facing controls.
                                  x-codeRefs:
                                      - packages/contracts/src/policy/types.ts#PresentationSettingsMetadata
                                      - packages/contracts/src/web/schemas.ts#PresentationSettingsMetadataSchema
                                      - >-
                                          packages/backend/src/services/runtimeRequestControls.ts#resolvePresentationGenerationSettings
                                  type: object
                                  properties:
                                      requested:
                                          $ref: '#/components/schemas/PresentationGenerationSettings'
                                      forwarded:
                                          $ref: '#/components/schemas/PresentationGenerationSettings'
                                      omitted:
                                          type: array
                                          items:
                                              type: object
                                              properties:
                                                  setting:
                                                      type: string
                                                      enum:
                                                          - promptVariant
                                                          - maxOutputTokens
                                                          - reasoningEffort
                                                          - verbosity
                                                          - temperature
                                                          - topP
                                                  requested:
                                                      oneOf:
                                                          - type: string
                                                          - type: number
                                                  reasonCode:
                                                      type: string
                                                      enum:
                                                          - sampling_control_not_supported
                                                          - verbosity_not_supported
                                                          - reasoning_effort_not_supported
                                                          - output_limit_exceeds_profile_maximum
                                                          - sampling_controls_mutually_exclusive
                                              required:
                                                  - setting
                                                  - requested
                                                  - reasonCode
                                              additionalProperties: false
                                      providerObserved:
                                          $ref: '#/components/schemas/PresentationGenerationSettings'
                                  required:
                                      - requested
                                      - forwarded
                                      - omitted
                                  additionalProperties: false
                              draftProfileId:
                                  type: string
                              draftRequestedProvider:
                                  type: string
                              draftRequestedModel:
                                  type: string
                              draftObservedProvider:
                                  type: string
                                  description: >-
                                      Provider observed after a style-draft generation result returned. Absent when
                                      the draft failed or timed out before returning.
                              draftObservedModel:
                                  type: string
                                  description: >-
                                      Model observed after a style-draft generation result returned. Absent when the
                                      draft failed or timed out before returning.
                              upstreamInferenceProvider:
                                  type: string
                                  description: >-
                                      Upstream-reported style-draft inference provider. Footnote does not
                                      independently verify this value.
                              upstreamResolvedModel:
