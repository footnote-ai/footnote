                                      - 1
                                      - 2
                                      - 3
                                      - 4
                                      - 5
                              expressionStrength:
                                  type: string
                                  enum:
                                      - subtle
                                      - balanced
                                      - strong
                                  description: Resolved persona expression strength.
                              expressionSource:
                                  type: string
                                  enum:
                                      - request
                                      - profile
                                      - persona_default
                                  description: Resolution source for the expression preference.
                          required:
                              - step
                              - flow
                              - outcome
                              - attempted
                              - reasonCode
                              - personaId
                              - draftAttemptCount
                              - expressionStrength
                              - expressionSource
                          additionalProperties: false
