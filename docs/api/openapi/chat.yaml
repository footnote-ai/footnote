paths:
    /api/chat:
        post:
            operationId: postChat
            x-codeRefs:
                - packages/backend/src/handlers/chat.ts#createChatHandler
                - packages/web/src/utils/api.ts#chatQuestion
                - packages/contracts/src/web/types.ts#PostChatRequest
                - packages/contracts/src/web/types.ts#ChatAssistantIdentity
                - packages/contracts/src/web/types.ts#PostChatResponse
                - packages/contracts/src/web/schemas.ts#ChatAssistantIdentitySchema
                - packages/contracts/src/web/schemas.ts#ResponseMetadataSchema
                - packages/contracts/src/web/schemas.ts#PresentationMetadataSchema
                - packages/contracts/src/policy/types.ts#PresentationMetadata
                - packages/contracts/src/policy/types.ts#PresentationSettingsMetadata
                - packages/contracts/src/policy/types.ts#PersonaExpressionStrength
                - packages/contracts/src/policy/schemas.ts#PersonaExpressionStrengthSchema
            summary: Generate a chat response
            description: >
                Submit a transport-neutral chat request and receive the backend-selected action.

                Public web callers use Turnstile when enabled; trusted internal callers may authenticate with service
                headers.

                Trusted agent callers may use `x-agent-token` with the configured `AGENT_API_TOKEN` secret.

                Send X-Session-Id / X-Turnstile-Token headers when needed for browser traffic.

                Optionally provide `botPersonaId` to select the backend-owned bot persona overlay (discord).

                Trusted Discord adapters may provide `assistantIdentity` for formatting-only cleanup of accidental
                self-labels. The backend does not use it for persona, policy, or provenance authority.

                Optionally provide `personaExpressionStrength` to request prose-only persona expression (`subtle`,
                `balanced`, or `strong`).

                Configured Discord adapters carry their operator default separately as
                `personaExpressionProfileStrength`; the backend records that value as profile-sourced rather than
                request-sourced.

                Optionally provide `maxReviewCycles` and `traceTarget` to tune workflow depth and TRACE posture for this
                request.
            tags:
                - Chat
            parameters:
                - $ref: '#/components/parameters/SessionIdHeader'
                - $ref: '#/components/parameters/TurnstileTokenHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChatRequest'
            security:
                - {}
                - AgentToken: []
                - TrustedServiceToken: []
                - TraceToken: []
            responses:
                '200':
                    $ref: '#/components/responses/ChatOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalServerError'
                '502':
                    $ref: '#/components/responses/BadGateway'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
        options:
            operationId: optionsChat
            x-codeRefs:
                - packages/backend/src/handlers/chat.ts#createChatHandler
            summary: CORS preflight
            description: |
                Handle CORS preflight for the chat endpoint.
                Public endpoint; no auth or rate limits.
            tags:
                - Chat
            responses:
                '204':
                    $ref: '#/components/responses/PreflightAccepted'
    /api/chat/profiles:
        get:
            operationId: getChatProfiles
            x-codeRefs:
                - packages/backend/src/handlers/chatProfiles.ts#createChatProfilesHandler
                - packages/api-client/src/chat.ts#createChatApi
                - packages/contracts/src/web/types.ts#GetChatProfilesResponse
            summary: List enabled chat profile options
            description: |
                Returns enabled chat profile ids for model/profile switching UX.
                This endpoint is public-safe and excludes provider secrets/internal config.
            tags:
                - Chat
            responses:
                '200':
                    description: Enabled chat profile options.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChatProfilesResponse'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
    /api/internal/text:
        post:
            operationId: postInternalTextTask
            x-codeRefs:
                - packages/backend/src/handlers/internalText.ts#handleInternalTextRequest
                - packages/backend/src/services/internalText.ts#createInternalNewsTaskService
                - packages/backend/src/services/internalText.ts#createInternalImageDescriptionTaskService
                - packages/api-client/src/internalText.ts#runNewsTaskViaApi
                - packages/api-client/src/internalText.ts#runImageDescriptionTaskViaApi
                - packages/contracts/src/web/types.ts#PostInternalTextRequest
                - packages/contracts/src/web/types.ts#PostInternalTextResponse
            summary: Run a trusted internal text task
            description: >
                Trusted internal endpoint for backend-owned text tasks that should not become a generic prompt proxy.

                The current task set includes `news` and `image_description`.

                Requires either `x-service-token` or `x-trace-token`.

                Applies the backend trusted-service rate limit bucket, including per-token constraints for authenticated
                internal callers.
            tags:
                - Chat
            security:
                - TrustedServiceToken: []
                - TraceToken: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InternalTextRequest'
            responses:
                '200':
                    $ref: '#/components/responses/InternalTextTaskOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '502':
                    $ref: '#/components/responses/BadGateway'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
components:
    schemas:
        ChatRequest:
            type: object
            properties:
                surface:
                    type: string
                    enum:
                        - web
                        - discord
                botPersonaId:
                    type: string
                    pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
                    description: Optional bot persona selector used for backend-owned persona overlays (discord).
                assistantIdentity:
                    $ref: '#/components/schemas/ChatAssistantIdentity'
                personaExpressionStrength:
                    type: string
                    enum:
                        - subtle
                        - balanced
                        - strong
                    description: >-
                        Optional request-local persona expression override. It affects prose only; TRACE posture and
                        safety authority remain backend-owned.
                personaExpressionProfileStrength:
                    type: string
                    enum:
                        - subtle
                        - balanced
                        - strong
                    writeOnly: true
                    description: >-
                        Operator default carried by a configured persona adapter. The backend records this preference as
                        profile-sourced; callers should not use it as a request override.
                modeId:
                    type: string
                    enum:
                        - express
                        - balanced
                        - grounded
                    description: 'Optional user-facing workflow mode selector (`express`, `balanced`, or `grounded`).'
                maxReviewCycles:
                    type: integer
                    minimum: 0
                    description: Optional hard override for reviewed workflow cycle depth.
                traceTarget:
                    type: object
                    description: Optional partial TRACE target override for this request.
                    properties:
                        tightness:
                            type: integer
                            enum:
                                - 1
                                - 2
                                - 3
                                - 4
                                - 5
                        rationale:
                            type: integer
                            enum:
                                - 1
                                - 2
                                - 3
                                - 4
                                - 5
                        attribution:
                            type: integer
                            enum:
                                - 1
                                - 2
                                - 3
                                - 4
                                - 5
                        caution:
                            type: integer
                            enum:
                                - 1
                                - 2
                                - 3
                                - 4
                                - 5
                        extent:
                            type: integer
                            enum:
                                - 1
                                - 2
                                - 3
                                - 4
                                - 5
                    additionalProperties: false
                trigger:
                    type: object
                    properties:
                        kind:
                            type: string
                            enum:
                                - submit
                                - direct
                                - invoked
                                - alias_candidate
                                - catchup
                        messageId:
                            type: string
                            minLength: 1
                        addressing:
                            $ref: '#/components/schemas/ChatAddressingEvidence'
                    required:
                        - kind
                    additionalProperties: false
                latestUserInput:
                    type: string
                    minLength: 0
                    maxLength: 3072
                    description: >-
                        May be an empty string for passive catchup requests; chatPlanner will typically default these to
                        ignore.
                conversation:
                    type: array
                    minItems: 1
                    maxItems: 64
                    items:
                        $ref: '#/components/schemas/ChatConversationMessage'
                attachments:
                    type: array
                    maxItems: 8
                    items:
                        $ref: '#/components/schemas/ChatAttachment'
                capabilities:
                    $ref: '#/components/schemas/ChatCapabilities'
                sessionId:
                    type: string
                    minLength: 1
                    maxLength: 128
                surfaceContext:
                    type: object
                    properties:
                        channelId:
                            type: string
                            minLength: 1
                        guildId:
                            type: string
                            minLength: 1
                        userId:
                            type: string
                            minLength: 1
                        requestHost:
                            type: string
                            minLength: 1
                    additionalProperties: false
            required:
                - surface
                - trigger
                - latestUserInput
                - conversation
            additionalProperties: false
        ChatAssistantIdentity:
            type: object
            description: >-
                Trusted Discord adapter identity used only for response-formatting cleanup; it does not select persona
                prompts or policy authority.
            properties:
                displayName:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: .*\\S.*
                mentionAliases:
                    type: array
                    maxItems: 32
                    items:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: .*\\S.*
            required:
                - displayName
                - mentionAliases
            additionalProperties: false
        ChatAddressingParticipant:
            oneOf:
                - type: object
                  properties:
                      kind:
                          const: persona
                      relation:
                          type: string
                          enum:
                              - explicit_mention
                              - reply
                              - plaintext_reference
                      personaId:
                          type: string
                          pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
                      displayName:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: .*\\S.*
                  required:
                      - kind
                      - relation
                      - personaId
                      - displayName
                  additionalProperties: false
                - type: object
                  properties:
                      kind:
                          const: external_participant
                      relation:
                          type: string
                          enum:
                              - explicit_mention
                              - reply
                              - plaintext_reference
                      displayName:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: .*\\S.*
                  required:
                      - kind
                      - relation
                      - displayName
                  additionalProperties: false
                - type: object
                  properties:
                      kind:
                          const: unknown
                      relation:
                          type: string
                          enum:
                              - explicit_mention
                              - reply
                              - plaintext_reference
                  required:
                      - kind
                      - relation
                  additionalProperties: false
        ChatAddressingEvidence:
            type: object
            description: >-
                Semantic addressing facts supplied by a trusted surface adapter. Discord account IDs and mention markup
                are not included.
            x-codeRefs:
                - packages/contracts/src/web/types.ts#ChatAddressingEvidence
                - packages/contracts/src/web/schemas.ts#ChatAddressingEvidenceSchema
            properties:
                participants:
                    type: array
                    maxItems: 64
                    default: []
                    items:
                        $ref: '#/components/schemas/ChatAddressingParticipant'
                resolution:
                    type: string
                    enum:
                        - complete
                        - degraded
                    default: degraded
                assistantMentioned:
                    type: boolean
                replyToAssistant:
                    type: boolean
                otherParticipantMentioned:
                    type: boolean
                replyToOtherParticipant:
                    type: boolean
            required:
                - assistantMentioned
                - replyToAssistant
                - otherParticipantMentioned
                - replyToOtherParticipant
            additionalProperties: false
        ChatProfileOption:
            type: object
            properties:
                id:
                    type: string
                    minLength: 1
                description:
                    type: string
                    minLength: 1
            required:
                - id
            additionalProperties: false
        ChatProfilesResponse:
            type: object
            properties:
                profiles:
                    type: array
                    maxItems: 100
                    items:
                        $ref: '#/components/schemas/ChatProfileOption'
            required:
                - profiles
            additionalProperties: false
        ChatResponse:
            discriminator:
                propertyName: action
                mapping:
                    message: '#/components/schemas/ChatMessageAction'
                    react: '#/components/schemas/ChatReactAction'
                    ignore: '#/components/schemas/ChatIgnoreAction'
                    image: '#/components/schemas/ChatImageAction'
            oneOf:
                - $ref: '#/components/schemas/ChatMessageAction'
                - $ref: '#/components/schemas/ChatReactAction'
                - $ref: '#/components/schemas/ChatIgnoreAction'
                - $ref: '#/components/schemas/ChatImageAction'
        InternalTextRequest:
            oneOf:
                - $ref: '#/components/schemas/InternalNewsTaskRequest'
                - $ref: '#/components/schemas/InternalImageDescriptionTaskRequest'
            discriminator:
                propertyName: task
                mapping:
                    news: '#/components/schemas/InternalNewsTaskRequest'
                    image_description: '#/components/schemas/InternalImageDescriptionTaskRequest'
        InternalTextResponse:
            oneOf:
                - $ref: '#/components/schemas/InternalNewsTaskResponse'
                - $ref: '#/components/schemas/InternalImageDescriptionTaskResponse'
            discriminator:
                propertyName: task
                mapping:
                    news: '#/components/schemas/InternalNewsTaskResponse'
                    image_description: '#/components/schemas/InternalImageDescriptionTaskResponse'
        ChatConversationMessage:
            type: object
            properties:
                role:
                    type: string
                    enum:
                        - system
                        - user
                        - assistant
                content:
                    type: string
                    minLength: 1
                authorName:
                    type: string
                    minLength: 1
                authorId:
                    type: string
                    minLength: 1
                messageId:
                    type: string
                    minLength: 1
                createdAt:
                    type: string
                    minLength: 1
                    format: date-time
            required:
                - role
                - content
            additionalProperties: false
        ChatAttachment:
            type: object
            properties:
                kind:
                    type: string
                    enum:
                        - image
                url:
                    type: string
                    minLength: 1
                    format: uri
                    pattern: '^https?://'
                contentType:
                    type: string
                    minLength: 1
            required:
                - kind
                - url
            additionalProperties: false
        ChatCapabilities:
            type: object
            properties:
                canReact:
                    type: boolean
                canGenerateImages:
                    type: boolean
                canUseTts:
                    type: boolean
            required:
                - canReact
                - canGenerateImages
                - canUseTts
            additionalProperties: false
        ChatImageRequest:
            type: object
            properties:
                prompt:
                    type: string
                    minLength: 1
                aspectRatio:
                    type: string
                    enum:
                        - auto
                        - square
                        - portrait
                        - landscape
                background:
                    type: string
                    minLength: 1
                quality:
                    type: string
                    enum:
                        - low
                        - medium
                        - high
                        - auto
                style:
                    type: string
                    minLength: 1
                allowPromptAdjustment:
                    type: boolean
                followUpResponseId:
                    type: string
                    minLength: 1
                outputFormat:
                    type: string
                    enum:
                        - png
                        - webp
                        - jpeg
                outputCompression:
                    type: integer
                    minimum: 1
                    maximum: 100
            required:
                - prompt
            additionalProperties: false
        ChatMessageAction:
            type: object
            properties:
                action:
                    type: string
                    enum:
                        - message
                message:
                    type: string
                    minLength: 1
                modality:
                    type: string
                    enum:
                        - text
                        - tts
                answerProvenanceEligible:
                    type: boolean
                    description: Whether the user-visible response is eligible for normal answer-provenance presentation.
                metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
            required:
                - action
                - message
                - modality
                - metadata
            additionalProperties: true
        ChatReactAction:
            type: object
            properties:
                action:
                    type: string
                    enum:
                        - react
                reaction:
                    type: string
                    minLength: 1
                metadata:
                    type: 'null'
            required:
                - action
                - reaction
                - metadata
            additionalProperties: true
        ChatIgnoreAction:
            type: object
            properties:
                action:
                    type: string
                    enum:
                        - ignore
                metadata:
                    type: 'null'
            required:
                - action
                - metadata
            additionalProperties: true
        ChatImageAction:
            type: object
            properties:
                action:
                    type: string
                    enum:
                        - image
                imageRequest:
                    $ref: '#/components/schemas/ChatImageRequest'
                metadata:
                    type: 'null'
            required:
                - action
                - imageRequest
                - metadata
            additionalProperties: true
        WorkflowStepSignals:
            type: object
            description: Primitive workflow step signal bag with documented canonical keys for known workflow step outputs.
            properties:
                purpose:
                    type: string
                    enum:
                        - chat_orchestrator_action_selection
                contractType:
                    type: string
                    enum:
                        - structured
                        - text_json
                        - fallback
                applyOutcome:
                    type: string
                    enum:
                        - applied
                        - adjusted_by_policy
                        - not_applied
                action:
                    type: string
                    enum:
                        - message
                        - react
                        - ignore
                        - image
                modality:
                    type: string
                    enum:
                        - text
                        - tts
                requestedCapabilityProfile:
                    type: string
                selectedCapabilityProfile:
                    type: string
                profileId:
                    type: string
                originalProfileId:
                    type: string
                effectiveProfileId:
                    type: string
                provider:
                    type: string
                mattered:
                    type: boolean
                matteredControlCount:
                    type: integer
                    minimum: 0
                routingChainAttemptCount:
                    type: integer
                    minimum: 0
                routingChainAttemptsJson:
                    type: string
                    description: JSON array string containing bounded routing-chain attempt telemetry.
                selectedProfileId:
                    type: string
                    nullable: true
                selectedProvider:
                    type: string
                    nullable: true
                selectedModel:
                    type: string
                    nullable: true
                routedProfileId:
                    type: string
                    nullable: true
                routedProvider:
                    type: string
                    nullable: true
                routedModel:
                    type: string
                    nullable: true
                assessRoutingHintsCsv:
                    type: string
                routingHintApplied:
                    type: string
                    enum:
                        - openai_first_logic
                        - ollama_first_style
                        - cheaper_first
                        - none
                routingHintConflictResolved:
                    type: string
                    enum:
                        - logic_over_style
                clarificationReasonCode:
                    type: string
                clarificationOptionCount:
                    type: integer
                    minimum: 0
                terminalAction:
                    type: string
                    enum:
                        - react
                        - ignore
                        - image
                refinementApplied:
                    type: boolean
                    enum:
                        - true
                refinementSourceStepId:
                    type: string
                appliedModuleCount:
                    type: integer
                    minimum: 0
                appliedModuleIdsCsv:
                    type: string
                reentryAttempt:
                    type: integer
                    minimum: 0
                reviewParseStatus:
                    type: string
                    enum:
                        - failed
                reviewParseFailureReason:
                    type: string
                    enum:
                        - empty_output
                        - non_json_object
                        - invalid_json
                        - schema_invalid
                reviewParseFailureMessage:
                    type: string
                reviewParseOutputLength:
                    type: integer
                    minimum: 0
                reviewParseIssueCount:
                    type: integer
                    minimum: 0
                reviewParseFirstIssuePath:
                    type: string
                reviewParseFirstIssueCode:
                    type: string
                reviewDecision:
                    type: string
                    enum:
                        - finalize
                        - revise
                reviewReason:
                    type: string
                revisionInstruction:
                    type: string
                refinementRequested:
                    type: boolean
                moduleHintCount:
                    type: integer
                    minimum: 0
                moduleHintIdsCsv:
                    type: string
                lengthConcern:
                    type: string
                    enum:
                        - too_long
                        - ok
                styleConcern:
                    type: string
                    enum:
                        - too_stiff
                        - ok
                evidenceConcern:
                    type: string
                    enum:
                        - needs_caution
                        - ok
                traceAlignment:
                    type: string
                    enum:
                        - aligned
                        - misaligned
                traceAlignmentReason:
                    type: string
                finalTemperamentTightness:
                    type: integer
                    minimum: 1
                    maximum: 5
                finalTemperamentRationale:
                    type: integer
                    minimum: 1
                    maximum: 5
                finalTemperamentAttribution:
                    type: integer
                    minimum: 1
                    maximum: 5
                finalTemperamentCaution:
                    type: integer
                    minimum: 1
                    maximum: 5
                finalTemperamentExtent:
                    type: integer
                    minimum: 1
                    maximum: 5
            additionalProperties:
                oneOf:
                    - type: string
                    - type: number
                    - type: boolean
                    - type: 'null'
        WorkflowStepOutcome:
            type: object
            properties:
                status:
                    type: string
                    enum:
                        - executed
                        - skipped
                        - failed
                summary:
                    type: string
                    minLength: 1
                artifacts:
                    type: array
                    items:
                        type: string
                signals:
                    $ref: '#/components/schemas/WorkflowStepSignals'
                recommendations:
                    type: array
                    items:
                        type: string
            required:
                - status
                - summary
            additionalProperties: false
        WorkflowStepRecord:
            type: object
            properties:
                stepId:
                    type: string
                    minLength: 1
                parentStepId:
                    type: string
                    minLength: 1
                attempt:
                    type: integer
                    minimum: 1
                stepKind:
                    type: string
                    enum:
                        - plan
                        - tool
                        - generate
                        - assess
                        - revise
                        - presentation
                        - finalize
                reasonCode:
                    type: string
                    enum:
                        - planner_runtime_error
                        - planner_invalid_output
                        - evaluator_runtime_error
                        - generation_runtime_error
                        - generation_empty_output
                        - generation_failed_output
                        - generation_incomplete_before_output
                        - presentation_candidate_generated
                        - presentation_candidate_unavailable
                        - presentation_finalized
                        - presentation_fallback
                        - tool_not_requested
                        - tool_not_used
                        - search_rerouted_to_fallback_profile
                        - search_reroute_not_permitted_by_selection_source
                        - search_reroute_no_tool_capable_fallback_available
                        - tool_unavailable
                        - tool_execution_error
                        - tool_timeout
                        - tool_http_error
                        - tool_network_error
                        - tool_invalid_response
                        - location_not_resolved
                        - search_not_supported_by_selected_profile
                        - unspecified_tool_outcome
                        - routing_chain_exhausted
                        - routing_chain_entry_ineligible
                        - routing_chain_transient_error
                        - routing_chain_non_transient_error
                startedAt:
                    type: string
                    format: date-time
                    description: Footnote-observed Step wall-clock start.
                finishedAt:
                    type: string
                    format: date-time
                    description: Footnote-observed Step wall-clock finish.
                durationMs:
                    type: integer
                    minimum: 0
                    description: Derived from Footnote-observed Step timestamps; not provider or internal compute time.
                model:
                    type: string
                usage:
                    description: Aggregated from provider/runtime-reported Attempt usage. Omitted counts are unavailable, not zero.
                    type: object
                    properties:
                        promptTokens:
                            type: integer
                            minimum: 0
                        cachedInputTokens:
                            type: integer
                            minimum: 0
                        cacheWriteTokens:
                            type: integer
                            minimum: 0
                        completionTokens:
                            type: integer
                            minimum: 0
                        totalTokens:
                            type: integer
                            minimum: 0
                        reasoningTokens:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                cost:
                    description: Backend-computed estimate summed from available Attempt costs; not a provider-reported bill.
                    type: object
                    properties:
                        inputCostUsd:
                            type: number
                            minimum: 0
                            description: Backend-computed cost estimate in USD.
                        outputCostUsd:
                            type: number
                            minimum: 0
                            description: Backend-computed cost estimate in USD.
                        totalCostUsd:
                            type: number
                            minimum: 0
                            description: Backend-computed cost estimate in USD.
                        costCompleteness:
                            type: string
                            enum:
                                - complete
                                - partial
                                - unknown
                            description: Whether the estimate is fully supported by available pricing and usage facts. Unknown remains distinct from a complete numeric zero.
                        costAppliedRules:
                            type: array
                            items:
                                type: string
                                enum:
                                    - prompt_cache_read_discount
                                    - prompt_cache_write_multiplier
                                    - gpt_5_6_long_context_input_multiplier
                                    - gpt_5_6_long_context_output_multiplier
                        costIncompleteReasons:
                            type: array
                            items:
                                type: string
                                enum:
                                    - unpriced_model
                                    - cached_input_tokens_unavailable
                                    - cache_write_tokens_unavailable
                                    - invalid_input_token_breakdown
                                    - provider_usage_unavailable
