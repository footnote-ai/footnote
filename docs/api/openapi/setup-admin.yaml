paths:
    /api/admin/executions/{responseId}:
        get:
            operationId: getOperatorExecution
            x-codeRefs:
                - packages/backend/src/handlers/operatorExecution.ts#createOperatorExecutionHandler
                - packages/contracts/src/policy/types.ts#WorkflowRecord
            summary: Read one bounded execution record as an account operator
            description: >-
                Returns the canonical workflow record for one response. Requires a live Footnote account session
                authorized by the backend administrator policy. This route does not accept setup or service tokens.
            tags:
                - Admin
            security:
                - AccountSessionCookie: []
            parameters:
                - name: responseId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '400':
                    $ref: '#/components/responses/BadRequest'
                '200':
                    description: Bounded canonical execution record.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OperatorExecutionRecord'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '500':
                    $ref: '#/components/responses/InternalServerError'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /api/setup/session:
        post:
            operationId: postSetupSession
            x-codeRefs:
                - packages/backend/src/handlers/setupSession.ts#createSetupSessionHandlers
                - packages/contracts/src/web/types.ts#PostSetupSessionRequest
                - packages/contracts/src/web/types.ts#PostSetupSessionResponse
            summary: Exchange one-time setup bootstrap code for setup session
            description: |
                Exchanges a one-time `fn_setup_...` bootstrap code for a short-lived httpOnly setup session cookie.
                Returns setup-session CSRF token required for non-GET admin settings writes.
                First-run sessions are valid only while settings are missing; operator sessions stay valid until TTL.
            tags:
                - Admin
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetupSessionRequest'
            responses:
                '200':
                    $ref: '#/components/responses/SetupSessionOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        delete:
            operationId: deleteSetupSession
            x-codeRefs:
                - packages/backend/src/handlers/setupSession.ts#createSetupSessionHandlers
            summary: Clear setup session cookie
            description: |
                Clears setup session cookie and invalidates the in-memory session record when present.
            tags:
                - Admin
            responses:
                '204':
                    description: Setup session cleared.
                    headers:
                        Set-Cookie:
                            description: Expires the setup-session cookie immediately.
                            schema:
                                type: string
                            example: footnote_setup_session=; Path=/; Max-Age=0; HttpOnly; SameSite=Strict
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
    /api/setup/operator-link:
        post:
            operationId: postSetupOperatorLink
            x-codeRefs:
                - packages/backend/src/handlers/setupSession.ts#createSetupSessionHandlers
                - packages/contracts/src/web/types.ts#PostSetupOperatorLinkRequest
                - packages/contracts/src/web/types.ts#PostSetupOperatorLinkResponse
            summary: Issue local-only operator settings link
            description: >
                Issues a short-lived setup/settings link for local operator tooling.

                Requests must originate from loopback; Fly operators reach this endpoint through `fly ssh console`.

                `settings` opens the existing config when present. `reset` backs up and removes the config before
                issuing a first-run link.
            tags:
                - Admin
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetupOperatorLinkRequest'
            responses:
                '200':
                    $ref: '#/components/responses/SetupOperatorLinkOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    /api/admin/settings/schema:
        get:
            operationId: getAdminSettingsSchema
            x-codeRefs:
                - packages/backend/src/handlers/adminSettings.ts#createAdminSettingsHandlers
                - packages/contracts/src/web/types.ts#GetAdminSettingsSchemaResponse
            summary: Fetch editable settings schema metadata
            description: |
                Trusted admin endpoint that returns metadata for YAML-editable runtime settings.
                Auth accepts either `x-admin-token`, or a valid setup session cookie.
                When setup is not required and SETTINGS_ADMIN_TOKEN is unset, endpoint returns 503.
            tags:
                - Admin
            security:
                - AdminSettingsToken: []
                - SetupSessionCookie: []
            responses:
                '200':
                    $ref: '#/components/responses/AdminSettingsSchemaOk'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /api/admin/settings/template:
        get:
            operationId: getAdminSettingsTemplate
            x-codeRefs:
                - packages/backend/src/handlers/adminSettings.ts#createAdminSettingsHandlers
            summary: Fetch canonical commented settings template YAML
            description: |
                Trusted admin endpoint that returns the canonical full commented `footnote.yaml` template.
                Auth accepts either `x-admin-token`, or a valid setup session cookie.
                When setup is not required and SETTINGS_ADMIN_TOKEN is unset, endpoint returns 503.
            tags:
                - Admin
            security:
                - AdminSettingsToken: []
                - SetupSessionCookie: []
            responses:
                '200':
                    $ref: '#/components/responses/AdminSettingsTemplateOk'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /api/admin/settings.yaml:
        get:
            operationId: getAdminSettingsYaml
            x-codeRefs:
                - packages/backend/src/handlers/adminSettings.ts#createAdminSettingsHandlers
            summary: Fetch canonical settings YAML
            description: |
                Trusted admin endpoint that returns the canonical persisted settings YAML document.
                Auth accepts either `x-admin-token`, or a valid setup session cookie.
                When setup is not required and SETTINGS_ADMIN_TOKEN is unset, endpoint returns 503.
            tags:
                - Admin
            security:
                - AdminSettingsToken: []
                - SetupSessionCookie: []
            responses:
                '200':
                    $ref: '#/components/responses/AdminSettingsYamlOk'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
        put:
            operationId: putAdminSettingsYaml
            x-codeRefs:
                - packages/backend/src/handlers/adminSettings.ts#createAdminSettingsHandlers
                - packages/contracts/src/web/types.ts#PutAdminSettingsYamlResponse
            summary: Replace canonical settings YAML
            description: >
                Trusted admin endpoint that validates and replaces the canonical persisted settings YAML document.

                Auth accepts either `x-admin-token`, or a valid setup session cookie.

                Setup-session auth requires `x-setup-csrf` on non-GET calls.

                Requires If-Match optimistic concurrency with either current YAML ETag or `"footnote-settings-missing"`
                while file is absent.
            tags:
                - Admin
            security:
                - AdminSettingsToken: []
                - SetupSessionCookie: []
            parameters:
                - $ref: '#/components/parameters/IfMatchHeader'
                - $ref: '#/components/parameters/SetupCsrfHeader'
            requestBody:
                required: true
                content:
                    text/yaml:
                        schema:
                            type: string
            responses:
                '200':
                    $ref: '#/components/responses/AdminSettingsYamlPutOk'
                '400':
                    $ref: '#/components/responses/AdminSettingsValidationFailed'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '412':
                    $ref: '#/components/responses/PreconditionFailed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '428':
                    $ref: '#/components/responses/PreconditionRequired'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /api/admin/settings/validate:
        post:
            operationId: postAdminSettingsValidate
            x-codeRefs:
                - packages/backend/src/handlers/adminSettings.ts#createAdminSettingsHandlers
                - packages/contracts/src/web/types.ts#PostAdminSettingsValidateRequest
                - packages/contracts/src/web/types.ts#PostAdminSettingsValidateResponse
            summary: Validate admin settings YAML without writing
            description: |
                Trusted admin endpoint that validates YAML settings without persisting changes.
                Auth accepts either `x-admin-token`, or a valid setup session cookie.
                Setup-session auth requires `x-setup-csrf` on non-GET calls.
                When setup is not required and SETTINGS_ADMIN_TOKEN is unset, endpoint returns 503.
            tags:
                - Admin
            security:
                - AdminSettingsToken: []
                - SetupSessionCookie: []
            parameters:
                - $ref: '#/components/parameters/SetupCsrfHeader'
            requestBody:
                required: true
                content:
                    text/yaml:
                        schema:
                            type: string
            responses:
                '200':
                    $ref: '#/components/responses/AdminSettingsValidateOk'
                '400':
                    $ref: '#/components/responses/AdminSettingsValidationFailed'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /config.json:
        get:
            operationId: getRuntimeConfig
            x-codeRefs:
                - packages/backend/src/handlers/config.ts#createRuntimeConfigHandler
                - packages/web/src/utils/api.ts#getRuntimeConfig
                - packages/contracts/src/web/types.ts#GetRuntimeConfigResponse
            summary: Fetch runtime config
            description: |
                Return public runtime configuration for web clients.
                Public endpoint; no auth or rate limits.
            tags:
                - System
            responses:
                '200':
                    $ref: '#/components/responses/RuntimeConfigOk'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '500':
                    $ref: '#/components/responses/InternalServerError'
components:
    schemas:
        OperatorExecutionRecord:
            type: object
            properties:
                responseId:
                    type: string
                workflow:
                    $ref: '#/components/schemas/WorkflowRecord'
            required:
                - responseId
                - workflow
            additionalProperties: false
            x-codeRefs:
                - packages/backend/src/handlers/operatorExecution.ts#createOperatorExecutionHandler
                - packages/contracts/src/policy/types.ts#WorkflowRecord
        RuntimeConfig:
            type: object
            properties:
                turnstileSiteKey:
                    type: string
                    description: Empty string when Turnstile is disabled.
                setup:
                    type: object
                    properties:
                        required:
                            type: boolean
                            description: True only when FOOTNOTE_SETTINGS_PATH currently resolves to a missing file (ENOENT).
                        routePath:
                            type: string
                            enum:
                                - /setup
                    required:
                        - required
                        - routePath
                    additionalProperties: false
                publicContext:
                    type: object
                    description: Public context-source messaging is enabled only after backend readiness validation.
                    properties:
                        nycSept11Records:
                            type: boolean
                    required:
                        - nycSept11Records
                    additionalProperties: false
            required:
                - turnstileSiteKey
                - setup
                - publicContext
            additionalProperties: false
        SetupSessionRequest:
            type: object
            properties:
                code:
                    type: string
                    minLength: 1
            required:
                - code
            additionalProperties: false
        SetupSessionResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                expiresAt:
                    type: string
                    format: date-time
                csrfToken:
                    type: string
            required:
                - ok
                - expiresAt
                - csrfToken
            additionalProperties: false
        SetupOperatorLinkRequest:
            type: object
            properties:
                action:
                    type: string
                    enum:
                        - settings
                        - reset
            required:
                - action
            additionalProperties: false
        SetupOperatorLinkResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                action:
                    type: string
                    enum:
                        - settings
                        - reset
                mode:
                    type: string
                    enum:
                        - operator
                        - first-run
                setupPath:
                    type: string
                setupUrl:
                    type: string
                    format: uri
                expiresAt:
                    type: string
                    format: date-time
                settingsState:
                    type: string
                    enum:
                        - present
                        - missing
                        - reset
                backupPath:
                    type: string
            required:
                - ok
                - action
                - mode
                - setupPath
                - setupUrl
                - expiresAt
                - settingsState
            additionalProperties: false
        AdminSettingsSchemaField:
            type: object
            properties:
                envKey:
                    type: string
                section:
                    type: string
                path:
                    type: array
                    items:
                        type: string
                kind:
                    type: string
                    enum:
                        - string
                        - boolean
                        - integer
                        - number
                        - csv
                        - enum
                        - json
                description:
                    type: string
                defaultValue:
                    oneOf:
                        - type: string
                        - type: number
                        - type: boolean
                        - type: array
                          items:
                              type: string
                allowedValues:
                    type: array
                    items:
                        type: string
            required:
                - envKey
                - section
                - path
                - kind
                - description
            additionalProperties: false
        AdminSettingsSchemaResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                schemaVersion:
                    type: integer
                settingsDocumentVersion:
                    type: integer
                fields:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminSettingsSchemaField'
            required:
                - ok
                - schemaVersion
                - settingsDocumentVersion
                - fields
            additionalProperties: false
        AdminSettingsValidateResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                valid:
                    type: boolean
                    const: true
                normalizedSummary:
                    type: object
                    properties:
                        version:
                            type: integer
                        settingsKeysCount:
                            type: integer
                        discordBotsCount:
                            type: integer
                    required:
                        - version
                        - settingsKeysCount
                        - discordBotsCount
                    additionalProperties: false
                warnings:
                    type: array
                    items:
                        type: string
                restartRequired:
                    type: boolean
                    const: true
            required:
                - ok
                - valid
                - normalizedSummary
                - warnings
                - restartRequired
            additionalProperties: false
        AdminSettingsValidationError:
            type: object
            properties:
                message:
                    type: string
                pointer:
                    type: string
                    nullable: true
                category:
                    type: string
                    enum:
                        - yaml_parse_error
                        - invalid_root
                        - legacy_shape_removed
                        - invalid_key_format
                        - unsupported_key
                        - secret_key_forbidden
                        - bootstrap_key_forbidden
                        - invalid_version
                        - type_mismatch
                        - payload_too_large
                        - internal_error
            required:
                - message
                - pointer
                - category
            additionalProperties: false
        AdminSettingsValidationFailureResponse:
            type: object
            properties:
                error:
                    type: string
                validationErrors:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminSettingsValidationError'
            required:
                - error
                - validationErrors
            additionalProperties: false
        AdminSettingsYamlPutResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                etag:
                    type: string
                restartRequired:
                    type: boolean
                    const: true
                applied:
                    type: boolean
                    const: false
            required:
                - ok
                - etag
                - restartRequired
                - applied
            additionalProperties: false
