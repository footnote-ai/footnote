paths:
    /api/admin/executions/{responseId}:
        get:
            operationId: getOperatorExecution
            x-codeRefs:
                - packages/backend/src/handlers/operatorExecution.ts#createOperatorExecutionHandler
                - packages/contracts/src/policy/types.ts#WorkflowRecord
                - packages/contracts/src/web/types.ts#ExecutionReportResponse
                - packages/web/src/utils/api.ts#getExecutionReport
            summary: Get a workflow execution report
            description: >-
                Returns the workflow and bounded model debug material recorded for a response. Requires a signed-in
                account with admin access. Setup and service tokens cannot use this endpoint.
            tags:
                - Admin
            security:
                - AccountSessionCookie: []
            parameters:
                - name: responseId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '400':
                    $ref: '#/components/responses/BadRequest'
                '200':
                    description: Workflow execution report.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExecutionReportResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '500':
                    $ref: '#/components/responses/InternalServerError'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /api/setup/session:
        post:
            operationId: postSetupSession
            x-codeRefs:
                - packages/backend/src/handlers/setupSession.ts#createSetupSessionHandlers
                - packages/contracts/src/web/types.ts#PostSetupSessionRequest
                - packages/contracts/src/web/types.ts#PostSetupSessionResponse
            summary: Exchange one-time setup bootstrap code for setup session
            description: |
                Exchanges a one-time `fn_setup_...` bootstrap code for a short-lived httpOnly setup session cookie.
                Returns setup-session CSRF token required for non-GET admin settings writes.
                First-run sessions are valid only while settings are missing; operator sessions stay valid until TTL.
            tags:
                - Admin
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetupSessionRequest'
            responses:
                '200':
                    $ref: '#/components/responses/SetupSessionOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        delete:
            operationId: deleteSetupSession
            x-codeRefs:
                - packages/backend/src/handlers/setupSession.ts#createSetupSessionHandlers
            summary: Clear setup session cookie
            description: |
                Clears setup session cookie and invalidates the in-memory session record when present.
            tags:
                - Admin
            responses:
                '204':
                    description: Setup session cleared.
                    headers:
                        Set-Cookie:
                            description: Expires the setup-session cookie immediately.
                            schema:
                                type: string
                            example: footnote_setup_session=; Path=/; Max-Age=0; HttpOnly; SameSite=Strict
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
    /api/setup/operator-link:
        post:
            operationId: postSetupOperatorLink
            x-codeRefs:
                - packages/backend/src/handlers/setupSession.ts#createSetupSessionHandlers
                - packages/contracts/src/web/types.ts#PostSetupOperatorLinkRequest
                - packages/contracts/src/web/types.ts#PostSetupOperatorLinkResponse
            summary: Issue local-only operator settings link
            description: >
                Issues a short-lived setup/settings link for local operator tooling.

                Requests must originate from loopback; Fly operators reach this endpoint through `fly ssh console`.

                `settings` opens the existing config when present. `reset` backs up and removes the config before
                issuing a first-run link.
            tags:
                - Admin
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetupOperatorLinkRequest'
            responses:
                '200':
                    $ref: '#/components/responses/SetupOperatorLinkOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    /api/setup/repository-context/connection:
        get:
            operationId: getSetupRepositoryContextConnectionState
            x-codeRefs:
                - packages/backend/src/handlers/setupRepositoryContext.ts#createSetupRepositoryContextHandlers
                - packages/contracts/src/web/types.ts#GetSetupRepositoryContextConnectionStateResponse
            summary: Get the configured TrustGraph setup state
            description: >-
                Returns only server-approved TrustGraph target identifiers and routing metadata. Connection credentials
                remain in backend runtime configuration and are never returned to the browser. Requires a valid setup
                session.
            tags:
                - Admin
            security:
                - SetupSessionCookie: []
            responses:
                '200':
                    description: Configured targets, or an empty list when TrustGraph is unavailable.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SetupRepositoryContextConnectionState'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
    /api/setup/repository-context/connection/test:
        post:
            operationId: postSetupRepositoryContextConnectionTest
            x-codeRefs:
                - packages/backend/src/handlers/setupRepositoryContext.ts#createSetupRepositoryContextHandlers
                - packages/contracts/src/web/types.ts#PostSetupRepositoryContextConnectionTestRequest
                - packages/contracts/src/web/types.ts#PostSetupRepositoryContextConnectionTestResponse
            summary: Test a configured TrustGraph target
            description: >-
                Tests a target already approved in backend runtime configuration. The request selects only a target ID;
                credentials and service URLs cannot be supplied by the browser. Requires a setup session and its CSRF
                token.
            tags:
                - Admin
            security:
                - SetupSessionCookie: []
            parameters:
                - $ref: '#/components/parameters/SetupCsrfHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetupRepositoryContextConnectionTestRequest'
            responses:
                '200':
                    description: The configured target is reachable.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SetupRepositoryContextConnectionTestResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '409':
                    $ref: '#/components/responses/Conflict'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '502':
                    description: TrustGraph connection test failed.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
    /api/setup/repository-context/preview:
        get:
            operationId: getSetupRepositoryContextPreview
            x-codeRefs:
                - packages/backend/src/handlers/setupRepositoryContext.ts#createSetupRepositoryContextHandlers
                - packages/contracts/src/web/types.ts#GetSetupRepositoryContextPreviewResponse
            summary: Preview the prepared repository context bundle
            description: >-
                Lists bounded file paths and sizes from the deployment-prepared bundle only. The backend does not use
                a checkout or Git for this operation. Requires a valid setup session.
            tags:
                - Admin
            security:
                - SetupSessionCookie: []
            responses:
                '200':
                    description: Prepared bundle revision, selected file count, total bytes, and skipped files.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SetupRepositoryContextPreviewResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
    /api/setup/repository-context/load:
        post:
            operationId: postSetupRepositoryContextLoad
            x-codeRefs:
                - packages/backend/src/handlers/setupRepositoryContext.ts#createSetupRepositoryContextHandlers
                - packages/contracts/src/web/types.ts#PostSetupRepositoryContextLoadRequest
                - packages/contracts/src/web/types.ts#PostSetupRepositoryContextLoadResponse
            summary: Load the prepared repository context once during setup
            description: >-
                Reconciles only the approved prepared bundle with a target already approved in backend runtime
                configuration. Credentials remain in backend runtime configuration; the browser supplies only a target
                ID and receives bounded per-file status results. Requires a setup session and its CSRF token.
            tags:
                - Admin
            security:
                - SetupSessionCookie: []
            parameters:
                - $ref: '#/components/parameters/SetupCsrfHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetupRepositoryContextLoadRequest'
            responses:
                '200':
                    description: Per-file load statuses and result counts; repository contents and credentials are omitted.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SetupRepositoryContextLoadResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '409':
                    $ref: '#/components/responses/Conflict'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '502':
                    description: Repository context load failed.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
    /api/admin/settings/schema:
        get:
            operationId: getAdminSettingsSchema
            x-codeRefs:
                - packages/backend/src/handlers/adminSettings.ts#createAdminSettingsHandlers
                - packages/contracts/src/web/types.ts#GetAdminSettingsSchemaResponse
            summary: Fetch editable settings schema metadata
            description: |
                Trusted admin endpoint that returns metadata for YAML-editable runtime settings.
                Auth accepts either `x-admin-token`, or a valid setup session cookie.
                When setup is not required and SETTINGS_ADMIN_TOKEN is unset, endpoint returns 503.
            tags:
                - Admin
            security:
                - AdminSettingsToken: []
                - SetupSessionCookie: []
            responses:
                '200':
                    $ref: '#/components/responses/AdminSettingsSchemaOk'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /api/admin/settings/template:
        get:
            operationId: getAdminSettingsTemplate
            x-codeRefs:
                - packages/backend/src/handlers/adminSettings.ts#createAdminSettingsHandlers
            summary: Fetch canonical commented settings template YAML
            description: |
                Trusted admin endpoint that returns the canonical full commented `footnote.yaml` template.
                Auth accepts either `x-admin-token`, or a valid setup session cookie.
                When setup is not required and SETTINGS_ADMIN_TOKEN is unset, endpoint returns 503.
            tags:
                - Admin
            security:
                - AdminSettingsToken: []
                - SetupSessionCookie: []
            responses:
                '200':
                    $ref: '#/components/responses/AdminSettingsTemplateOk'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /api/admin/settings.yaml:
        get:
            operationId: getAdminSettingsYaml
            x-codeRefs:
                - packages/backend/src/handlers/adminSettings.ts#createAdminSettingsHandlers
            summary: Fetch canonical settings YAML
            description: |
                Trusted admin endpoint that returns the canonical persisted settings YAML document.
                Auth accepts either `x-admin-token`, or a valid setup session cookie.
                When setup is not required and SETTINGS_ADMIN_TOKEN is unset, endpoint returns 503.
            tags:
                - Admin
            security:
                - AdminSettingsToken: []
                - SetupSessionCookie: []
            responses:
                '200':
                    $ref: '#/components/responses/AdminSettingsYamlOk'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
        put:
            operationId: putAdminSettingsYaml
            x-codeRefs:
                - packages/backend/src/handlers/adminSettings.ts#createAdminSettingsHandlers
                - packages/contracts/src/web/types.ts#PutAdminSettingsYamlResponse
            summary: Replace canonical settings YAML
            description: >
                Trusted admin endpoint that validates and replaces the canonical persisted settings YAML document.

                Auth accepts either `x-admin-token`, or a valid setup session cookie.

                Setup-session auth requires `x-setup-csrf` on non-GET calls.

                Requires If-Match optimistic concurrency with either current YAML ETag or `"footnote-settings-missing"`
                while file is absent.
            tags:
                - Admin
            security:
                - AdminSettingsToken: []
                - SetupSessionCookie: []
            parameters:
                - $ref: '#/components/parameters/IfMatchHeader'
                - $ref: '#/components/parameters/SetupCsrfHeader'
            requestBody:
                required: true
                content:
                    text/yaml:
                        schema:
                            type: string
            responses:
                '200':
                    $ref: '#/components/responses/AdminSettingsYamlPutOk'
                '400':
                    $ref: '#/components/responses/AdminSettingsValidationFailed'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '412':
                    $ref: '#/components/responses/PreconditionFailed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '428':
                    $ref: '#/components/responses/PreconditionRequired'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /api/admin/settings/validate:
        post:
            operationId: postAdminSettingsValidate
            x-codeRefs:
                - packages/backend/src/handlers/adminSettings.ts#createAdminSettingsHandlers
                - packages/contracts/src/web/types.ts#PostAdminSettingsValidateRequest
                - packages/contracts/src/web/types.ts#PostAdminSettingsValidateResponse
            summary: Validate admin settings YAML without writing
            description: |
                Trusted admin endpoint that validates YAML settings without persisting changes.
                Auth accepts either `x-admin-token`, or a valid setup session cookie.
                Setup-session auth requires `x-setup-csrf` on non-GET calls.
                When setup is not required and SETTINGS_ADMIN_TOKEN is unset, endpoint returns 503.
            tags:
                - Admin
            security:
                - AdminSettingsToken: []
                - SetupSessionCookie: []
            parameters:
                - $ref: '#/components/parameters/SetupCsrfHeader'
            requestBody:
                required: true
                content:
                    text/yaml:
                        schema:
                            type: string
            responses:
                '200':
                    $ref: '#/components/responses/AdminSettingsValidateOk'
                '400':
                    $ref: '#/components/responses/AdminSettingsValidationFailed'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '503':
                    $ref: '#/components/responses/ServiceUnavailable'
    /config.json:
        get:
            operationId: getRuntimeConfig
            x-codeRefs:
                - packages/backend/src/handlers/config.ts#createRuntimeConfigHandler
                - packages/web/src/utils/api.ts#getRuntimeConfig
                - packages/contracts/src/web/types.ts#GetRuntimeConfigResponse
            summary: Fetch runtime config
            description: |
                Return public runtime configuration for web clients.
                Public endpoint; no auth or rate limits.
            tags:
                - System
            responses:
                '200':
                    $ref: '#/components/responses/RuntimeConfigOk'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '500':
                    $ref: '#/components/responses/InternalServerError'
components:
    schemas:
        ExecutionReportResponse:
            type: object
            properties:
                responseId:
                    type: string
                workflow:
                    $ref: '#/components/schemas/WorkflowRecord'
                modelDebugCaptures:
                    type: array
                    maxItems: 33
                    description: Bounded model input/output material for this Run, or an empty list when unavailable.
                    items:
                        $ref: '#/components/schemas/ExecutionReportDebugCapture'
            required:
                - responseId
                - workflow
                - modelDebugCaptures
            additionalProperties: false
            x-codeRefs:
                - packages/backend/src/handlers/operatorExecution.ts#createOperatorExecutionHandler
                - packages/contracts/src/policy/types.ts#WorkflowRecord
                - packages/contracts/src/web/types.ts#ExecutionReportResponse
        ExecutionReportDebugCapture:
            type: object
            description: Bounded debug material for one model invocation; it is not the delivered answer.
            properties:
                runId:
                    type: string
                stepId:
                    type: string
                attempt:
                    type: integer
                    minimum: 1
                invocation:
                    type: integer
                    minimum: 0
                inputText:
                    type: string
                    description: At most 16,384 UTF-16 code units of model-visible input; inputTruncated indicates an incomplete body.
                inputTruncated:
                    type: boolean
                inputRedacted:
                    type: boolean
                outputText:
                    type: string
                    description: At most 16,384 UTF-16 code units of model output or reused candidate text; outputTruncated indicates an incomplete body.
                outputCandidateId:
                    type: string
                outputTruncated:
                    type: boolean
                outputRedacted:
                    type: boolean
                outputUnavailable:
                    type: boolean
                captureLimitReached:
                    type: boolean
                omittedInvocationCount:
                    type: integer
                    minimum: 1
            required:
                - runId
                - stepId
                - attempt
                - invocation
                - inputText
                - inputTruncated
                - inputRedacted
            additionalProperties: false
            x-codeRefs:
                - packages/backend/src/storage/traces/sqliteTraceStore.ts#ModelDebugCaptureRecord
                - packages/contracts/src/web/types.ts#ExecutionReportDebugCapture
        RuntimeConfig:
            type: object
            properties:
                turnstileSiteKey:
                    type: string
                    description: Empty string when Turnstile is disabled.
                setup:
                    type: object
                    properties:
                        required:
                            type: boolean
                            description: True only when FOOTNOTE_SETTINGS_PATH currently resolves to a missing file (ENOENT).
                        routePath:
                            type: string
                            enum:
                                - /setup
                    required:
                        - required
                        - routePath
                    additionalProperties: false
                publicContext:
                    type: object
                    description: Public context-source messaging is enabled only after backend readiness validation.
                    properties:
                        nycSept11Records:
                            type: boolean
                    required:
                        - nycSept11Records
                    additionalProperties: false
            required:
                - turnstileSiteKey
                - setup
                - publicContext
            additionalProperties: false
        SetupSessionRequest:
            type: object
            properties:
                code:
                    type: string
                    minLength: 1
            required:
                - code
            additionalProperties: false
        SetupSessionResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                expiresAt:
                    type: string
                    format: date-time
                csrfToken:
                    type: string
            required:
                - ok
                - expiresAt
                - csrfToken
            additionalProperties: false
        SetupOperatorLinkRequest:
            type: object
            properties:
                action:
                    type: string
                    enum:
                        - settings
                        - reset
            required:
                - action
            additionalProperties: false
        SetupOperatorLinkResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    const: true
                action:
                    type: string
                    enum:
                        - settings
                        - reset
                mode:
                    type: string
                    enum:
                        - operator
                        - first-run
                setupPath:
                    type: string
                setupUrl:
                    type: string
                    format: uri
                expiresAt:
                    type: string
                    format: date-time
                settingsState:
                    type: string
                    enum:
                        - present
                        - missing
                        - reset
                backupPath:
                    type: string
            required:
                - ok
                - action
                - mode
                - setupPath
                - setupUrl
                - expiresAt
                - settingsState
            additionalProperties: false
        SetupRepositoryContextTarget:
            type: object
            properties:
                id:
                    type: string
                flow:
                    type: string
                collection:
                    type: string
                workspace:
                    type: string
            required:
                - id
                - flow
                - collection
                - workspace
            additionalProperties: false
        SetupRepositoryContextConnectionState:
            type: object
            description: Backend-provisioned TrustGraph targets; credentials are never returned.
            properties:
                configured:
                    type: boolean
                targets:
                    type: array
                    maxItems: 8
                    items:
                        $ref: '#/components/schemas/SetupRepositoryContextTarget'
            required:
                - configured
                - targets
            additionalProperties: false
            x-codeRefs:
                - packages/contracts/src/web/types.ts#GetSetupRepositoryContextConnectionStateResponse
        SetupRepositoryContextConnectionTestRequest:
            type: object
            properties:
                targetId:
                    type: string
                    minLength: 1
                    maxLength: 128
            required:
                - targetId
            additionalProperties: false
            x-codeRefs:
                - packages/contracts/src/web/types.ts#PostSetupRepositoryContextConnectionTestRequest
        SetupRepositoryContextConnectionTestResponse:
            type: object
            properties:
                connected:
                    type: boolean
                    const: true
                targetId:
                    type: string
                testedAt:
                    type: string
                    format: date-time
            required:
                - connected
                - targetId
                - testedAt
            additionalProperties: false
            x-codeRefs:
                - packages/contracts/src/web/types.ts#PostSetupRepositoryContextConnectionTestResponse
        SetupRepositoryContextPreviewFile:
            type: object
            properties:
                path:
                    type: string
                sizeBytes:
                    type: integer
                    minimum: 0
            required:
                - path
                - sizeBytes
            additionalProperties: false
        SetupRepositoryContextPreviewResponse:
            type: object
            properties:
                revision:
                    type: string
                    pattern: '^[a-f0-9]{7,64}$'
                fileCount:
                    type: integer
                    minimum: 0
                totalBytes:
                    type: integer
                    minimum: 0
                files:
                    type: array
                    maxItems: 250
                    items:
                        $ref: '#/components/schemas/SetupRepositoryContextPreviewFile'
                skipped:
                    type: array
                    items:
                        type: object
                        properties:
                            path:
                                type: string
                            reason:
                                type: string
                        required:
                            - path
                            - reason
                        additionalProperties: false
            required:
                - revision
                - fileCount
                - totalBytes
                - files
                - skipped
            additionalProperties: false
            x-codeRefs:
                - packages/contracts/src/web/types.ts#GetSetupRepositoryContextPreviewResponse
        SetupRepositoryContextLoadRequest:
            type: object
            properties:
                targetId:
                    type: string
                    minLength: 1
                    maxLength: 128
            required:
                - targetId
            additionalProperties: false
            x-codeRefs:
                - packages/contracts/src/web/types.ts#PostSetupRepositoryContextLoadRequest
        SetupRepositoryContextLoadCounts:
            type: object
            properties:
                added:
                    type: integer
                    minimum: 0
                changed:
                    type: integer
                    minimum: 0
                unchanged:
                    type: integer
                    minimum: 0
                skipped:
                    type: integer
                    minimum: 0
                failed:
                    type: integer
                    minimum: 0
            required:
                - added
                - changed
                - unchanged
                - skipped
                - failed
            additionalProperties: false
        SetupRepositoryContextLoadItem:
            type: object
            properties:
                path:
                    type: string
                status:
                    type: string
                    enum:
                        - added
                        - changed
                        - unchanged
                        - skipped
                        - failed
                sizeBytes:
                    type: integer
                    minimum: 0
            required:
                - path
                - status
            additionalProperties: false
        SetupRepositoryContextLoadResponse:
            type: object
            properties:
                repositoryId:
                    type: string
                startedAt:
                    type: string
                    format: date-time
                completedAt:
                    type: string
                    format: date-time
                selectedFileCount:
                    type: integer
                    minimum: 0
                selectedBytes:
                    type: integer
                    minimum: 0
                counts:
                    $ref: '#/components/schemas/SetupRepositoryContextLoadCounts'
                items:
                    type: array
                    maxItems: 500
                    items:
                        $ref: '#/components/schemas/SetupRepositoryContextLoadItem'
            required:
                - repositoryId
                - startedAt
                - completedAt
                - selectedFileCount
                - selectedBytes
                - counts
                - items
            additionalProperties: false
            x-codeRefs:
                - packages/contracts/src/web/types.ts#PostSetupRepositoryContextLoadResponse
        AdminSettingsSchemaField:
            type: object
            properties:
                envKey:
                    type: string
                section:
                    type: string
                path:
                    type: array
                    items:
                        type: string
                kind:
                    type: string
                    enum:
                        - string
                        - boolean
                        - integer
                        - number
                        - csv
                        - enum
                        - json
                description:
                    type: string
