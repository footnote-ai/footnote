paths:
    /api/incidents/report:
        post:
            operationId: postIncidentReport
            x-codeRefs:
                - packages/backend/src/handlers/incidents.ts#handleIncidentReportRequest
                - packages/api-client/src/incidents.ts#reportIncident
                - packages/contracts/src/web/types.ts#PostIncidentReportRequest
                - packages/contracts/src/web/types.ts#PostIncidentReportResponse
                - packages/contracts/src/web/schemas.ts#PostIncidentReportResponseSchema
            summary: Create an incident report
            description: >
                Trusted internal endpoint for Discord-driven incident reports. Returns a one-time, 30-day claim code to
                the trusted bot; only its hash is persisted, and the code is shown privately to the reporter for a later
                explicit association.

                Accepts raw Discord resource identifiers from the bot and persists only pseudonymized pointers.

                Requires either `x-service-token` or `x-trace-token`.

                Intended for trusted internal callers; normal internal service rate limits still apply.
            tags:
                - Incidents
            security:
                - TrustedServiceToken: []
                - TraceToken: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IncidentReportRequest'
                        example:
                            reporterUserId: '123456789012345678'
                            guildId: '234567890123456789'
                            channelId: '345678901234567890'
                            messageId: '456789012345678901'
                            jumpUrl: 'https://discord.com/channels/234567890123456789/345678901234567890/456789012345678901'
                            responseId: response_123
                            chainHash: hash_abc
                            modelVersion: gpt-5-mini
                            tags:
                                - safety
                                - review
                            description: The assistant gave risky instructions.
                            contact: moderator@example.com
                            consentedAt: '2026-03-13T17:00:00.000Z'
            responses:
                '200':
                    $ref: '#/components/responses/IncidentReportOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    /api/incidents:
        get:
            operationId: listIncidents
            x-codeRefs:
                - packages/backend/src/handlers/incidents.ts#handleIncidentListRequest
                - packages/api-client/src/incidents.ts#listIncidents
                - packages/contracts/src/web/types.ts#GetIncidentsResponse
            summary: List incidents
            description: |
                Trusted internal endpoint for newest-first operator-safe incident summaries.
                Requires either `x-service-token` or `x-trace-token`.
                Intended for trusted internal callers; normal internal service rate limits still apply.
            tags:
                - Incidents
            security:
                - TrustedServiceToken: []
                - TraceToken: []
            parameters:
                - name: status
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/IncidentStatus'
                - name: tag
                  in: query
                  required: false
                  schema:
                      type: string
                - name: createdFrom
                  in: query
                  required: false
                  schema:
                      type: string
                      format: date-time
                - name: createdTo
                  in: query
                  required: false
                  schema:
                      type: string
                      format: date-time
            responses:
                '200':
                    $ref: '#/components/responses/IncidentListOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    '/api/incidents/{incidentId}':
        get:
            operationId: getIncident
            x-codeRefs:
                - packages/backend/src/handlers/incidents.ts#handleIncidentDetailRequest
                - packages/api-client/src/incidents.ts#getIncident
                - packages/contracts/src/web/types.ts#GetIncidentResponse
            summary: Fetch one incident
            description: |
                Trusted internal endpoint for one operator-safe incident detail payload.
                Requires either `x-service-token` or `x-trace-token`.
                Intended for trusted internal callers; normal internal service rate limits still apply.
            tags:
                - Incidents
            security:
                - TrustedServiceToken: []
                - TraceToken: []
            parameters:
                - $ref: '#/components/parameters/IncidentId'
            responses:
                '200':
                    $ref: '#/components/responses/IncidentDetailOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    '/api/incidents/{incidentId}/status':
        post:
            operationId: postIncidentStatus
