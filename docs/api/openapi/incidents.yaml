                - packages/backend/src/handlers/incidents.ts#handleIncidentStatusRequest
                - packages/api-client/src/incidents.ts#updateIncidentStatus
                - packages/contracts/src/web/types.ts#PostIncidentStatusRequest
                - packages/contracts/src/web/types.ts#PostIncidentStatusResponse
            summary: Update incident status
            description: |
                Trusted internal endpoint for operator-driven incident status changes.
                Requires either `x-service-token` or `x-trace-token`.
                Intended for trusted internal callers; normal internal service rate limits still apply.
            tags:
                - Incidents
            security:
                - TrustedServiceToken: []
                - TraceToken: []
            parameters:
                - $ref: '#/components/parameters/IncidentId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IncidentStatusRequest'
                        example:
                            status: under_review
                            actorUserId: '999999999999999999'
                            notes: Reviewing report context now.
            responses:
                '200':
                    $ref: '#/components/responses/IncidentDetailOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    '/api/incidents/{incidentId}/notes':
        post:
            operationId: postIncidentNotes
            x-codeRefs:
                - packages/backend/src/handlers/incidents.ts#handleIncidentNotesRequest
                - packages/api-client/src/incidents.ts#addIncidentNote
                - packages/contracts/src/web/types.ts#PostIncidentNotesRequest
                - packages/contracts/src/web/types.ts#PostIncidentNotesResponse
            summary: Append an incident note
            description: |
                Trusted internal endpoint for adding operator notes without changing incident status.
                Requires either `x-service-token` or `x-trace-token`.
                Intended for trusted internal callers; normal internal service rate limits still apply.
            tags:
                - Incidents
            security:
                - TrustedServiceToken: []
                - TraceToken: []
            parameters:
                - $ref: '#/components/parameters/IncidentId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IncidentNotesRequest'
                        example:
                            actorUserId: '999999999999999999'
                            notes: Escalating to the safety review queue.
            responses:
                '200':
                    $ref: '#/components/responses/IncidentDetailOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '500':
                    $ref: '#/components/responses/InternalServerError'
    '/api/incidents/{incidentId}/remediation':
        post:
            operationId: postIncidentRemediation
            x-codeRefs:
                - packages/backend/src/handlers/incidents.ts#handleIncidentRemediationRequest
                - packages/api-client/src/incidents.ts#recordIncidentRemediation
                - packages/contracts/src/web/types.ts#PostIncidentRemediationRequest
                - packages/contracts/src/web/types.ts#PostIncidentRemediationResponse
            summary: Record incident remediation outcome
            description: |
                Trusted internal endpoint for recording the bot's immediate remediation attempt.
                Requires either `x-service-token` or `x-trace-token`.
                Intended for trusted internal callers; normal internal service rate limits still apply.
            tags:
                - Incidents
            security:
                - TrustedServiceToken: []
                - TraceToken: []
            parameters:
                - $ref: '#/components/parameters/IncidentId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IncidentRemediationRequest'
                        example:
                            actorUserId: '999999999999999999'
                            state: applied
                            notes: Warning banner applied with spoiler wrapping.
            responses:
                '200':
                    $ref: '#/components/responses/IncidentDetailOk'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '405':
                    $ref: '#/components/responses/MethodNotAllowed'
                '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                '500':
                    $ref: '#/components/responses/InternalServerError'
components:
    schemas:
        IncidentStatus:
            type: string
            enum:
                - new
                - under_review
                - confirmed
                - dismissed
                - resolved
        IncidentRemediationState:
            type: string
            enum:
                - pending
                - applied
                - already_marked
                - skipped_not_assistant
                - failed
        IncidentPointers:
            type: object
            properties:
                responseId:
                    type: string
                guildId:
                    type: string
                channelId:
                    type: string
                messageId:
                    type: string
                modelVersion:
                    type: string
                chainHash:
                    type: string
            additionalProperties: false
        IncidentAuditEvent:
            type: object
            properties:
                action:
                    type: string
                    enum:
                        - incident.created
                        - incident.remediated
                        - incident.status_changed
                        - incident.note_added
                actorHash:
                    type: string
                    nullable: true
                notes:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
            required:
                - action
                - createdAt
            additionalProperties: false
        IncidentRemediation:
            type: object
            properties:
                state:
                    $ref: '#/components/schemas/IncidentRemediationState'
                applied:
                    type: boolean
                notes:
                    type: string
                    nullable: true
                updatedAt:
                    type: string
                    format: date-time
                    nullable: true
            required:
                - state
                - applied
            additionalProperties: false
        IncidentSummary:
            type: object
            properties:
                incidentId:
                    type: string
                status:
                    $ref: '#/components/schemas/IncidentStatus'
                tags:
                    type: array
                    maxItems: 25
                    items:
                        type: string
                description:
                    type: string
                    nullable: true
                contact:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                consentedAt:
                    type: string
                    format: date-time
                pointers:
                    $ref: '#/components/schemas/IncidentPointers'
                remediation:
                    $ref: '#/components/schemas/IncidentRemediation'
            required:
                - incidentId
                - status
                - tags
                - createdAt
                - updatedAt
                - consentedAt
                - pointers
                - remediation
            additionalProperties: false
            example:
                incidentId: 1a2b3c4d
                status: under_review
                tags:
                    - safety
                    - review
                description: The assistant gave risky instructions.
                contact: moderator@example.com
                createdAt: '2026-03-13T17:00:00.000Z'
                updatedAt: '2026-03-13T17:05:00.000Z'
                consentedAt: '2026-03-13T17:00:00.000Z'
                pointers:
                    responseId: response_123
                    guildId: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    channelId: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    messageId: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                    modelVersion: gpt-5-mini
                    chainHash: hash_abc
                remediation:
                    state: applied
                    applied: true
                    notes: Warning banner applied with spoiler wrapping.
                    updatedAt: '2026-03-13T17:01:00.000Z'
        IncidentDetail:
            type: object
            properties:
                incidentId:
                    type: string
                status:
                    $ref: '#/components/schemas/IncidentStatus'
                tags:
                    type: array
                    maxItems: 25
                    items:
                        type: string
                description:
                    type: string
                    nullable: true
                contact:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                consentedAt:
                    type: string
                    format: date-time
                pointers:
                    $ref: '#/components/schemas/IncidentPointers'
                remediation:
                    $ref: '#/components/schemas/IncidentRemediation'
                auditEvents:
                    type: array
                    items:
                        $ref: '#/components/schemas/IncidentAuditEvent'
            required:
                - incidentId
                - status
                - tags
                - createdAt
                - updatedAt
                - consentedAt
                - pointers
                - remediation
                - auditEvents
            additionalProperties: false
            example:
                incidentId: 1a2b3c4d
                status: under_review
                tags:
                    - safety
                    - review
                description: The assistant gave risky instructions.
                contact: moderator@example.com
                createdAt: '2026-03-13T17:00:00.000Z'
                updatedAt: '2026-03-13T17:05:00.000Z'
                consentedAt: '2026-03-13T17:00:00.000Z'
                pointers:
                    responseId: response_123
                    guildId: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    channelId: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    messageId: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                    modelVersion: gpt-5-mini
                    chainHash: hash_abc
                remediation:
                    state: applied
                    applied: true
                    notes: Warning banner applied with spoiler wrapping.
                    updatedAt: '2026-03-13T17:01:00.000Z'
                auditEvents:
                    - action: incident.created
                      actorHash: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
                      notes: 'description provided; contact provided; tags=safety, review'
                      createdAt: '2026-03-13T17:00:00.000Z'
                    - action: incident.status_changed
                      actorHash: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                      notes: Reviewing report context now.
                      createdAt: '2026-03-13T17:03:00.000Z'
        IncidentReportRequest:
            type: object
            properties:
                reporterUserId:
                    type: string
                guildId:
                    type: string
                channelId:
                    type: string
                messageId:
                    type: string
                jumpUrl:
                    type: string
                    format: uri
                responseId:
                    type: string
                chainHash:
                    type: string
                modelVersion:
                    type: string
                tags:
                    type: array
                    items:
                        type: string
                description:
                    type: string
                contact:
                    type: string
                consentedAt:
                    type: string
                    format: date-time
            required:
                - reporterUserId
                - consentedAt
            additionalProperties: false
            example:
                reporterUserId: '123456789012345678'
                guildId: '234567890123456789'
                channelId: '345678901234567890'
                messageId: '456789012345678901'
                jumpUrl: 'https://discord.com/channels/234567890123456789/345678901234567890/456789012345678901'
                responseId: response_123
                chainHash: hash_abc
                modelVersion: gpt-5-mini
                tags:
                    - safety
                    - review
                description: The assistant gave risky instructions.
                contact: moderator@example.com
                consentedAt: '2026-03-13T17:00:00.000Z'
        IncidentReportResponse:
            type: object
            properties:
                incident:
                    $ref: '#/components/schemas/IncidentDetail'
                remediation:
                    type: object
                    properties:
                        state:
                            type: string
                            enum:
                                - pending
                    required:
                        - state
                    additionalProperties: false
                claimCode:
                    type: string
                    description: >-
                        One-time 256-bit claim code, valid for 30 days; returned only to the trusted reporting bot and
                        not stored in plaintext.
                    minLength: 43
                    maxLength: 43
            required:
                - incident
                - remediation
                - claimCode
            additionalProperties: false
            example:
                incident:
                    incidentId: 1a2b3c4d
                    status: new
                    tags:
                        - safety
                        - review
                    description: The assistant gave risky instructions.
                    contact: moderator@example.com
                    createdAt: '2026-03-13T17:00:00.000Z'
                    updatedAt: '2026-03-13T17:00:00.000Z'
                    consentedAt: '2026-03-13T17:00:00.000Z'
                    pointers:
                        responseId: response_123
                        guildId: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                        channelId: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                        messageId: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                        modelVersion: gpt-5-mini
                        chainHash: hash_abc
                    remediation:
                        state: pending
                        applied: false
                        notes: null
                        updatedAt: null
                    auditEvents:
                        - action: incident.created
                          actorHash: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
                          notes: 'description provided; contact provided; tags=safety, review'
                          createdAt: '2026-03-13T17:00:00.000Z'
                remediation:
                    state: pending
                claimCode: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        ReporterIncidentSummary:
            type: object
            properties:
                incidentId:
                    type: string
                status:
                    $ref: '#/components/schemas/IncidentStatus'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            required:
                - incidentId
                - status
                - createdAt
                - updatedAt
            additionalProperties: false
        AccountIncidentListResponse:
            type: object
            properties:
                incidents:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReporterIncidentSummary'
            required:
                - incidents
            additionalProperties: false
        AccountIncidentClaimRequest:
            type: object
            properties:
                claimCode:
                    type: string
                    minLength: 43
                    maxLength: 43
            required:
                - claimCode
            additionalProperties: false
        AccountIncidentClaimResponse:
            type: object
            properties:
                success:
                    type: boolean
                    enum:
                        - true
            required:
                - success
            additionalProperties: false
        IncidentListResponse:
            type: object
            properties:
                incidents:
                    type: array
                    items:
                        $ref: '#/components/schemas/IncidentSummary'
            required:
                - incidents
            additionalProperties: false
            example:
                incidents:
                    - incidentId: 1a2b3c4d
                      status: under_review
                      tags:
                          - safety
                          - review
                      description: The assistant gave risky instructions.
                      contact: moderator@example.com
                      createdAt: '2026-03-13T17:00:00.000Z'
                      updatedAt: '2026-03-13T17:05:00.000Z'
                      consentedAt: '2026-03-13T17:00:00.000Z'
                      pointers:
                          responseId: response_123
                          guildId: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                          channelId: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                          messageId: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                          modelVersion: gpt-5-mini
                          chainHash: hash_abc
                      remediation:
                          state: applied
                          applied: true
                          notes: Warning banner applied with spoiler wrapping.
                          updatedAt: '2026-03-13T17:01:00.000Z'
        IncidentDetailResponse:
            type: object
            properties:
                incident:
                    $ref: '#/components/schemas/IncidentDetail'
            required:
                - incident
            additionalProperties: false
            example:
                incident:
                    incidentId: 1a2b3c4d
                    status: under_review
                    tags:
                        - safety
                        - review
                    description: The assistant gave risky instructions.
                    contact: moderator@example.com
                    createdAt: '2026-03-13T17:00:00.000Z'
                    updatedAt: '2026-03-13T17:05:00.000Z'
                    consentedAt: '2026-03-13T17:00:00.000Z'
                    pointers:
                        responseId: response_123
                        guildId: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                        channelId: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                        messageId: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                        modelVersion: gpt-5-mini
                        chainHash: hash_abc
                    remediation:
                        state: applied
                        applied: true
                        notes: Warning banner applied with spoiler wrapping.
                        updatedAt: '2026-03-13T17:01:00.000Z'
                    auditEvents:
                        - action: incident.created
                          actorHash: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
                          notes: 'description provided; contact provided; tags=safety, review'
                          createdAt: '2026-03-13T17:00:00.000Z'
                        - action: incident.status_changed
                          actorHash: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                          notes: Reviewing report context now.
                          createdAt: '2026-03-13T17:03:00.000Z'
        IncidentStatusRequest:
            type: object
            properties:
                status:
                    $ref: '#/components/schemas/IncidentStatus'
                actorUserId:
                    type: string
                notes:
                    type: string
            required:
                - status
            additionalProperties: false
        IncidentNotesRequest:
            type: object
            properties:
                actorUserId:
                    type: string
                notes:
                    type: string
            required:
                - notes
            additionalProperties: false
        IncidentRemediationRequest:
            type: object
            properties:
                actorUserId:
                    type: string
                state:
                    type: string
                    enum:
                        - applied
                        - already_marked
                        - skipped_not_assistant
                        - failed
                notes:
                    type: string
            required:
                - state
            additionalProperties: false
